<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Word Pop 英语单词消消乐 · 浏览器预览</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #FFF4E0; overflow: hidden; }
  #game { display: block; touch-action: none; }
  #tip {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 4px 8px;
    font: 12px sans-serif; color: #999; text-align: center; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="tip">在线预览版 · Word Pop 英语消消乐（进度保存在本机浏览器）</div>
<script>
(function () {
  var canvas = document.getElementById('game');

  function sizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    // main.js 会按 windowWidth*pixelRatio 再设置一次宽高
  }
  sizeCanvas();

  // ---------- 极简 wx shim ----------
  var touchHandler = null;
  window.wx = {
    createCanvas: function () { return canvas; },
    getSystemInfoSync: function () {
      return {
        windowWidth: window.innerWidth,
        windowHeight: window.innerHeight,
        pixelRatio: window.devicePixelRatio || 1
      };
    },
    onTouchStart: function (fn) { touchHandler = fn; },
    setStorageSync: function (key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    },
    getStorageSync: function (key) {
      var raw = localStorage.getItem(key);
      if (raw === null) return '';
      try { return JSON.parse(raw); } catch (e) { return ''; }
    }
  };

  function fireTouch(clientX, clientY) {
    if (touchHandler) touchHandler({ touches: [{ clientX: clientX, clientY: clientY }] });
  }
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    fireTouch(t.clientX, t.clientY);
  }, { passive: false });
  canvas.addEventListener('mousedown', function (e) {
    fireTouch(e.clientX, e.clientY);
  });

  // ---------- 极简 CommonJS loader（同步 XHR，需 http(s) 打开） ----------
  var FILES = {"game.js":"// 微信小游戏入口\nvar Main = require('./js/main.js');\n\nMain.start();\n","js/main.js":"// 主逻辑：界面状态机（首页 / 游戏 / 结算 / 单词本）、触摸、连锁结算、进度存档。\nvar Board = require('./engine/board.js');\nvar Words = require('./data/words.js');\nvar Levels = require('./data/levels.js');\nvar R = require('./render/render.js');\n\nvar STORAGE_KEY = 'wordpop-progress-v1';\n\nvar canvas, ctx, W = 375, H = 667, DPR = 1;\n\nvar state = {\n  screen: 'home', // home | game | result | wordbook\n  grade: 3,\n  progress: null,\n  buttons: [],\n  // game\n  level: null,\n  grid: null,\n  poolMap: {},\n  selected: null,\n  hintPair: null,\n  flashCells: null,\n  busy: false,\n  movesLeft: 0,\n  score: 0,\n  targetProgress: {}, // en -> collected count\n  learned: {},         // en -> true（本关消除过的词）\n  message: '',\n  // result\n  result: null,\n  // wordbook\n  wbGrade: 3,\n  wbPage: 0\n};\n\n// ---------- 存档 ----------\nfunction defaultProgress() {\n  return { unlocked: { 3: 1, 4: 1, 5: 1, 6: 1 }, stars: {}, collected: [] };\n}\nfunction loadProgress() {\n  try {\n    var p = wx.getStorageSync(STORAGE_KEY);\n    if (p && typeof p === 'object' && p.unlocked) {\n      var d = defaultProgress();\n      Object.keys(d.unlocked).forEach(function (g) {\n        if (typeof p.unlocked[g] === 'number') d.unlocked[g] = p.unlocked[g];\n      });\n      d.stars = p.stars || {};\n      d.collected = p.collected || [];\n      return d;\n    }\n  } catch (e) { /* 忽略，走默认 */ }\n  return defaultProgress();\n}\nfunction saveProgress() {\n  try { wx.setStorageSync(STORAGE_KEY, state.progress); } catch (e) { /* 忽略 */ }\n}\n\n// ---------- 工具 ----------\nfunction text(str, x, y, size, color, align, bold) {\n  ctx.fillStyle = color || '#343A40';\n  ctx.font = (bold ? 'bold ' : '') + size + 'px sans-serif';\n  ctx.textAlign = align || 'center';\n  ctx.textBaseline = 'middle';\n  ctx.fillText(str, x, y);\n}\nfunction addButton(x, y, w, h, label, action, opts) {\n  opts = opts || {};\n  var btn = {\n    x: x, y: y, w: w, h: h, text: label, action: action,\n    fill: opts.fill || '#FF8C42', color: opts.color || '#FFFFFF',\n    fontSize: opts.fontSize || 16, disabled: !!opts.disabled\n  };\n  state.buttons.push(btn);\n  return btn;\n}\nfunction wordOf(en) {\n  return state.poolMap[en] || Words.lookup(en);\n}\n\n// ---------- 关卡 ----------\nfunction startLevel(grade, index) {\n  var level = Levels.getLevel(grade, index);\n  state.level = level;\n  state.poolMap = {};\n  level.pool.forEach(function (w) { state.poolMap[w.en] = w; });\n  state.grid = Board.createBoard(level.pool, Board.SIZE);\n  state.movesLeft = level.moves;\n  state.score = 0;\n  state.selected = null;\n  state.hintPair = null;\n  state.flashCells = null;\n  state.busy = false;\n  state.targetProgress = {};\n  level.targets.forEach(function (t) { state.targetProgress[t.en] = 0; });\n  state.learned = {};\n  state.message = '把相同的单词连成 3 个以上消除！';\n  state.screen = 'game';\n  draw();\n}\n\nfunction targetsDone() {\n  return state.level.targets.every(function (t) {\n    return (state.targetProgress[t.en] || 0) >= t.need;\n  });\n}\n\nfunction finishLevel(win) {\n  var level = state.level;\n  var stars = 0;\n  if (win) {\n    stars = Levels.calcStars(state.movesLeft, level.moves);\n    var key = level.grade + '-' + level.index;\n    if (!state.progress.stars[key] || state.progress.stars[key] < stars) {\n      state.progress.stars[key] = stars;\n    }\n    var unlocked = state.progress.unlocked[level.grade] || 1;\n    state.progress.unlocked[level.grade] = Math.min(Levels.LEVELS_PER_GRADE, Math.max(unlocked, level.index + 2));\n    Object.keys(state.learned).forEach(function (en) {\n      if (state.progress.collected.indexOf(en) < 0) state.progress.collected.push(en);\n    });\n    saveProgress();\n  }\n  var learnedWords = Object.keys(state.learned).map(function (en) { return wordOf(en); }).filter(Boolean);\n  learnedWords.sort(function (a, b) {\n    var at = state.level.targets.some(function (t) { return t.en === a.en; }) ? 0 : 1;\n    var bt = state.level.targets.some(function (t) { return t.en === b.en; }) ? 0 : 1;\n    return at - bt;\n  });\n  state.result = { win: win, stars: stars, score: state.score, learned: learnedWords };\n  state.screen = 'result';\n  draw();\n}\n\n// 一次交换后的连锁结算（分步进行，先闪烁再消除，便于看清）\nfunction runCascade(chain) {\n  var m = Board.findMatches(state.grid);\n  if (m.cells.length === 0) {\n    state.flashCells = null;\n    state.busy = false;\n    if (targetsDone()) { finishLevel(true); return; }\n    if (state.movesLeft <= 0) { finishLevel(false); return; }\n    if (!Board.hasAnyMove(state.grid)) {\n      Board.reshuffle(state.grid, state.level.pool);\n      state.message = '没有可走的步，已自动洗牌！';\n    }\n    draw();\n    return;\n  }\n  state.flashCells = m.cells;\n  draw();\n  setTimeout(function () {\n    var step = Board.resolveStep(state.grid, state.level.pool, Math.random, chain);\n    if (step) {\n      state.score += step.score;\n      Object.keys(step.cleared).forEach(function (en) {\n        state.learned[en] = true;\n        if (typeof state.targetProgress[en] === 'number') {\n          state.targetProgress[en] += step.cleared[en];\n        }\n      });\n    }\n    state.flashCells = null;\n    draw();\n    setTimeout(function () { runCascade(chain + 1); }, 90);\n  }, 240);\n}\n\nfunction onTileTap(r, c) {\n  if (state.busy) return;\n  state.hintPair = null;\n  var cell = { r: r, c: c };\n  if (!state.selected) {\n    state.selected = cell;\n    draw();\n    return;\n  }\n  if (state.selected.r === r && state.selected.c === c) {\n    state.selected = null;\n    draw();\n    return;\n  }\n  if (!Board.isAdjacent(state.selected, cell)) {\n    state.selected = cell;\n    draw();\n    return;\n  }\n  var a = state.selected;\n  state.selected = null;\n  // 先直观地交换，再由引擎校验（引擎失败会自动换回）\n  var ok = Board.trySwap(state.grid, a, cell);\n  if (!ok) {\n    state.message = '这样连不成 3 个，再试试！';\n    draw();\n    return;\n  }\n  state.movesLeft--;\n  state.busy = true;\n  state.message = '';\n  draw();\n  setTimeout(function () { runCascade(1); }, 120);\n}\n\n// ---------- 布局 ----------\nfunction boardGeom() {\n  var size = Math.min(W - 24, H * 0.52);\n  return { x: (W - size) / 2, y: 168, size: size, cell: size / Board.SIZE };\n}\n\n// ---------- 各界面绘制 ----------\nfunction drawBackground() {\n  ctx.fillStyle = '#FFF4E0';\n  ctx.fillRect(0, 0, W, H);\n  ctx.fillStyle = 'rgba(255, 214, 165, 0.5)';\n  ctx.beginPath(); ctx.arc(W * 0.08, H * 0.1, 46, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.arc(W * 0.95, H * 0.3, 30, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = 'rgba(178, 242, 187, 0.45)';\n  ctx.beginPath(); ctx.arc(W * 0.85, H * 0.88, 52, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.arc(W * 0.05, H * 0.7, 26, 0, Math.PI * 2); ctx.fill();\n}\n\nfunction drawHome() {\n  drawBackground();\n  state.buttons = [];\n  R.drawCat(ctx, W / 2, 108, 52);\n  text('Word Pop', W / 2, 182, 34, '#E8590C', 'center', true);\n  text('英 语 单 词 消 消 乐', W / 2, 216, 17, '#868E96', 'center', true);\n\n  // 年级选择\n  var grades = Words.GRADES;\n  var tabW = (W - 48 - 3 * 8) / 4;\n  grades.forEach(function (g, i) {\n    var x = 24 + i * (tabW + 8);\n    addButton(x, 244, tabW, 40, g + ' 年级', 'grade:' + g, {\n      fill: state.grade === g ? '#FF8C42' : '#FFE8CC',\n      color: state.grade === g ? '#FFFFFF' : '#E8590C',\n      fontSize: 15\n    });\n  });\n\n  // 开始按钮：进入当前年级第一个未通关关卡（全部通关则进最后一关）\n  var unlocked = state.progress.unlocked[state.grade] || 1;\n  var startIndex = unlocked - 1;\n  for (var i = 0; i < unlocked; i++) {\n    if (!state.progress.stars[state.grade + '-' + i]) { startIndex = i; break; }\n    startIndex = i;\n  }\n  addButton(W / 2 - 90, 300, 180, 52, '▶ 开始游戏', 'start', { fill: '#51CF66', fontSize: 20 });\n\n  // 关卡格子\n  text('选择关卡', 24, 386, 15, '#868E96', 'left', true);\n  var cols = 4, cellW = (W - 48 - (cols - 1) * 10) / cols, cellH = 62;\n  for (var lv = 0; lv < Levels.LEVELS_PER_GRADE; lv++) {\n    var cx = 24 + (lv % cols) * (cellW + 10);\n    var cy = 404 + Math.floor(lv / cols) * (cellH + 10);\n    var locked = lv >= unlocked;\n    var st = state.progress.stars[state.grade + '-' + lv] || 0;\n    ctx.fillStyle = locked ? '#E9ECEF' : '#FFFFFF';\n    R.roundRect(ctx, cx, cy, cellW, cellH, 12);\n    ctx.fill();\n    ctx.strokeStyle = '#FFD8A8';\n    ctx.lineWidth = 2;\n    R.roundRect(ctx, cx, cy, cellW, cellH, 12);\n    ctx.stroke();\n    text(locked ? '🔒' : '第 ' + (lv + 1) + ' 关', cx + cellW / 2, cy + 20, 15, locked ? '#ADB5BD' : '#343A40', 'center', true);\n    if (!locked && st > 0) R.drawStars(ctx, cx + cellW / 2, cy + 44, st, 3, 15);\n    if (!locked) {\n      state.buttons.push({ x: cx, y: cy, w: cellW, h: cellH, text: '', action: 'level:' + lv, fill: 'transparent', color: 'transparent', fontSize: 1, disabled: false, invisible: true });\n    }\n  }\n\n  addButton(W / 2 - 70, 404 + 2 * (cellH + 10) + 14, 140, 44, '📖 单词本', 'wordbook', { fill: '#4DABF7', fontSize: 17 });\n  var collectedCount = state.progress.collected.length;\n  text('已收集 ' + collectedCount + ' 个单词', W / 2, H - 26, 13, '#ADB5BD');\n}\n\nfunction drawGame() {\n  drawBackground();\n  state.buttons = [];\n  var level = state.level;\n  addButton(12, 12, 44, 36, '←', 'home', { fill: '#FFE8CC', color: '#E8590C', fontSize: 18 });\n  text(level.grade + ' 年级 · 第 ' + level.levelNo + ' 关', W / 2, 30, 17, '#343A40', 'center', true);\n  text('步数 ' + state.movesLeft, W - 70, 30, 15, state.movesLeft <= 5 ? '#E03131' : '#343A40', 'center', true);\n  text('得分 ' + state.score, W / 2, 58, 14, '#868E96');\n\n  // 目标面板\n  ctx.fillStyle = '#FFFFFF';\n  R.roundRect(ctx, 16, 74, W - 32, 78, 14);\n  ctx.fill();\n  text('收集目标', 30, 92, 13, '#868E96', 'left', true);\n  var tw = (W - 64) / Math.max(1, level.targets.length);\n  level.targets.forEach(function (t, i) {\n    var w = wordOf(t.en);\n    var got = Math.min(state.targetProgress[t.en] || 0, t.need);\n    var done = got >= t.need;\n    var cx = 32 + tw * i + tw / 2;\n    text((w && w.emoji ? w.emoji + ' ' : '') + t.en, cx, 116, 16, done ? '#2B8A3E' : '#343A40', 'center', true);\n    text(got + ' / ' + t.need + (done ? ' ✓' : ''), cx, 138, 13, done ? '#2B8A3E' : '#868E96');\n  });\n\n  // 棋盘\n  var g = boardGeom();\n  ctx.fillStyle = '#FFFFFF';\n  R.roundRect(ctx, g.x - 6, g.y - 6, g.size + 12, g.size + 12, 16);\n  ctx.fill();\n  var flashMap = {};\n  (state.flashCells || []).forEach(function (cell) { flashMap[cell.r + ',' + cell.c] = true; });\n  for (var r = 0; r < Board.SIZE; r++) {\n    for (var c = 0; c < Board.SIZE; c++) {\n      var tile = state.grid[r][c];\n      if (!tile) continue;\n      var opts = {\n        selected: state.selected && state.selected.r === r && state.selected.c === c,\n        flash: !!flashMap[r + ',' + c],\n        hinted: state.hintPair && ((state.hintPair.a.r === r && state.hintPair.a.c === c) || (state.hintPair.b.r === r && state.hintPair.b.c === c))\n      };\n      R.drawTile(ctx, tile, wordOf(tile.id), g.x + c * g.cell, g.y + r * g.cell, g.cell, opts);\n    }\n  }\n\n  // 底部：提示按钮 + 消息\n  addButton(W / 2 - 60, g.y + g.size + 22, 120, 42, '💡 提示', 'hint', { fill: '#FFD43B', color: '#664D03', fontSize: 16 });\n  if (state.message) text(state.message, W / 2, g.y + g.size + 88, 14, '#E8590C');\n  R.drawCat(ctx, W - 44, H - 40, 26);\n}\n\nfunction drawResult() {\n  drawBackground();\n  state.buttons = [];\n  var res = state.result;\n  var level = state.level;\n  R.drawCat(ctx, W / 2, 92, 46);\n  text(res.win ? '过关啦！🎉' : '差一点点！', W / 2, 158, 28, res.win ? '#E8590C' : '#868E96', 'center', true);\n  if (res.win) R.drawStars(ctx, W / 2, 196, res.stars, 3, 34);\n  text('得分 ' + res.score, W / 2, 232, 16, '#343A40', 'center', true);\n\n  text('本关学到的单词', W / 2, 268, 15, '#868E96', 'center', true);\n  var list = res.learned.slice(0, 8);\n  list.forEach(function (w, i) {\n    var col = i % 2, row = Math.floor(i / 2);\n    var x = 32 + col * ((W - 64) / 2), y = 292 + row * 34;\n    ctx.fillStyle = '#FFFFFF';\n    R.roundRect(ctx, x, y, (W - 64) / 2 - 6, 28, 8);\n    ctx.fill();\n    text((w.emoji ? w.emoji + ' ' : '') + w.en + '  ' + w.zh, x + ((W - 64) / 2 - 6) / 2, y + 14, 13, '#343A40');\n  });\n  if (res.learned.length === 0) text('（本关还没有消除单词）', W / 2, 300, 13, '#ADB5BD');\n\n  var btnY = 292 + Math.ceil(Math.max(1, list.length) / 2) * 34 + 22;\n  addButton(32, btnY, (W - 76) / 2, 46, '↻ 再来一局', 'retry', { fill: '#4DABF7', fontSize: 16 });\n  if (res.win && level.index < Levels.LEVELS_PER_GRADE - 1) {\n    addButton(44 + (W - 76) / 2, btnY, (W - 76) / 2, 46, '下一关 ▶', 'next', { fill: '#51CF66', fontSize: 16 });\n  } else {\n    addButton(44 + (W - 76) / 2, btnY, (W - 76) / 2, 46, '🏠 回首页', 'home', { fill: '#51CF66', fontSize: 16 });\n  }\n}\n\nfunction drawWordbook() {\n  drawBackground();\n  state.buttons = [];\n  addButton(12, 12, 44, 36, '←', 'home', { fill: '#FFE8CC', color: '#E8590C', fontSize: 18 });\n  text('我的单词本', W / 2, 30, 19, '#343A40', 'center', true);\n\n  var tabW = (W - 48 - 3 * 8) / 4;\n  Words.GRADES.forEach(function (g, i) {\n    var x = 24 + i * (tabW + 8);\n    addButton(x, 60, tabW, 36, g + ' 年级', 'wbgrade:' + g, {\n      fill: state.wbGrade === g ? '#4DABF7' : '#E7F5FF',\n      color: state.wbGrade === g ? '#FFFFFF' : '#1971C2',\n      fontSize: 14\n    });\n  });\n\n  var collectedSet = {};\n  state.progress.collected.forEach(function (en) { collectedSet[en] = true; });\n  var words = Words.byGrade(state.wbGrade).filter(function (w) { return collectedSet[w.en]; });\n  var perPage = 10;\n  var pages = Math.max(1, Math.ceil(words.length / perPage));\n  if (state.wbPage >= pages) state.wbPage = pages - 1;\n  var pageWords = words.slice(state.wbPage * perPage, state.wbPage * perPage + perPage);\n\n  if (pageWords.length === 0) {\n    R.drawCat(ctx, W / 2, 220, 44);\n    text('还没有收集到这个年级的单词', W / 2, 300, 15, '#868E96');\n    text('去玩游戏，消除单词就能收集啦！', W / 2, 328, 13, '#ADB5BD');\n  } else {\n    pageWords.forEach(function (w, i) {\n      var col = i % 2, row = Math.floor(i / 2);\n      var x = 20 + col * ((W - 48) / 2 + 8), y = 116 + row * 66;\n      var cw = (W - 48) / 2;\n      ctx.fillStyle = '#FFFFFF';\n      R.roundRect(ctx, x, y, cw, 58, 12);\n      ctx.fill();\n      ctx.fillStyle = R.colorFor(w.en);\n      R.roundRect(ctx, x, y, 6, 58, 3);\n      ctx.fill();\n      text(w.emoji || '🔤', x + 26, y + 29, 24, '#343A40');\n      text(w.en, x + 48, y + 20, 15, '#343A40', 'left', true);\n      text(w.zh, x + 48, y + 42, 12, '#868E96', 'left');\n    });\n  }\n  text('共 ' + words.length + ' 个 · 第 ' + (state.wbPage + 1) + ' / ' + pages + ' 页', W / 2, H - 84, 13, '#868E96');\n  addButton(32, H - 64, 110, 40, '上一页', 'wbprev', { fill: '#CED4DA', color: '#495057', disabled: state.wbPage <= 0 });\n  addButton(W - 142, H - 64, 110, 40, '下一页', 'wbnext', { fill: '#CED4DA', color: '#495057', disabled: state.wbPage >= pages - 1 });\n}\n\n// ---------- 主绘制 ----------\nfunction draw() {\n  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n  ctx.clearRect(0, 0, W, H);\n  if (state.screen === 'home') drawHome();\n  else if (state.screen === 'game') drawGame();\n  else if (state.screen === 'result') drawResult();\n  else if (state.screen === 'wordbook') drawWordbook();\n  // 画按钮（关卡格子的 invisible 按钮只做命中测试，不绘制）\n  state.buttons.forEach(function (btn) {\n    if (!btn.invisible) R.drawButton(ctx, btn);\n  });\n}\n\n// ---------- 触摸 ----------\nfunction handleTap(x, y) {\n  for (var i = state.buttons.length - 1; i >= 0; i--) {\n    var btn = state.buttons[i];\n    if (!btn.disabled && R.hit(btn, x, y)) {\n      handleAction(btn.action);\n      return;\n    }\n  }\n  if (state.screen === 'game') {\n    var g = boardGeom();\n    var c = Math.floor((x - g.x) / g.cell);\n    var r = Math.floor((y - g.y) / g.cell);\n    if (r >= 0 && r < Board.SIZE && c >= 0 && c < Board.SIZE) onTileTap(r, c);\n  }\n}\n\nfunction handleAction(action) {\n  var parts = action.split(':');\n  var name = parts[0], arg = parts[1];\n  if (name === 'grade') {\n    state.grade = parseInt(arg, 10);\n    draw();\n  } else if (name === 'start') {\n    var unlocked = state.progress.unlocked[state.grade] || 1;\n    var idx = unlocked - 1;\n    for (var i = 0; i < unlocked; i++) {\n      idx = i;\n      if (!state.progress.stars[state.grade + '-' + i]) break;\n    }\n    startLevel(state.grade, idx);\n  } else if (name === 'level') {\n    startLevel(state.grade, parseInt(arg, 10));\n  } else if (name === 'home') {\n    state.screen = 'home';\n    draw();\n  } else if (name === 'wordbook') {\n    state.wbGrade = state.grade;\n    state.wbPage = 0;\n    state.screen = 'wordbook';\n    draw();\n  } else if (name === 'wbgrade') {\n    state.wbGrade = parseInt(arg, 10);\n    state.wbPage = 0;\n    draw();\n  } else if (name === 'wbprev') {\n    if (state.wbPage > 0) { state.wbPage--; draw(); }\n  } else if (name === 'wbnext') {\n    state.wbPage++;\n    draw();\n  } else if (name === 'hint') {\n    if (!state.busy) {\n      state.hintPair = Board.findHint(state.grid);\n      state.message = state.hintPair ? '试试把发光的两个块换一下！' : '没有可走的步了…';\n      draw();\n    }\n  } else if (name === 'retry') {\n    startLevel(state.level.grade, state.level.index);\n  } else if (name === 'next') {\n    startLevel(state.level.grade, state.level.index + 1);\n  }\n}\n\n// ---------- 启动 ----------\nfunction start() {\n  canvas = wx.createCanvas();\n  var info = { windowWidth: 375, windowHeight: 667, pixelRatio: 1 };\n  try { info = wx.getSystemInfoSync(); } catch (e) { /* 用默认 */ }\n  W = info.windowWidth || 375;\n  H = info.windowHeight || 667;\n  DPR = info.pixelRatio || 1;\n  canvas.width = W * DPR;\n  canvas.height = H * DPR;\n  ctx = canvas.getContext('2d');\n  state.progress = loadProgress();\n  wx.onTouchStart(function (e) {\n    if (e.touches && e.touches[0]) handleTap(e.touches[0].clientX, e.touches[0].clientY);\n  });\n  draw();\n}\n\nmodule.exports = { start: start };\n","js/data/words.js":"// 词库加载：数据来自 data/db.json（用户维护的教材词库，唯一的单词数据库）\n// db.json 结构：[{ u: 单元号, t: 单元英文标题, z: 单元中文标题, w: [[en, zh], ...] }, ...]\n// 文件按册顺序排列，每册单元号从 1 重新开始。册与年级的对应（用户 2026-11-24 确认）：\n//   第1册=三年级上册 第2册=三年级下册 第3册=四年级上册 第4册=四年级下册\n//   第5册=五年级上册 第6册=五年级下册 第7册=六年级上册（以此类推）\n// emoji 由 js/data/emoji-map.js 按英文词自动配图；配不上的词只出单词块。\nvar DB = require('../../data/db.json');\nvar EMOJI = require('./emoji-map.js');\n\nvar GRADE_CN = { 3: '三', 4: '四', 5: '五', 6: '六' };\n\n// 按单元号重置切分出每一册\nvar RAW_BOOKS = [];\nvar currentBook = null;\nDB.forEach(function (unit) {\n  if (!currentBook || unit.u === 1) {\n    currentBook = [];\n    RAW_BOOKS.push(currentBook);\n  }\n  currentBook.push(unit);\n});\n\nvar BOOKS = RAW_BOOKS.map(function (units, i) {\n  var grade = 3 + Math.floor(i / 2);\n  var term = i % 2 === 0 ? '上' : '下';\n  return {\n    book: i + 1,\n    grade: grade,\n    term: term,\n    label: (GRADE_CN[grade] || grade) + '年级' + term + '册',\n    units: units\n  };\n});\n\n// 展开成词条：{ en, zh, emoji, grade, book, unit, theme }\nvar ALL = [];\nBOOKS.forEach(function (book) {\n  book.units.forEach(function (unit) {\n    unit.w.forEach(function (pair) {\n      ALL.push({\n        en: pair[0],\n        zh: pair[1],\n        emoji: EMOJI[(pair[0] || '').toLowerCase()] || null,\n        grade: book.grade,\n        book: book.book,\n        unit: unit.u,\n        theme: unit.t || ''\n      });\n    });\n  });\n});\n\n// 按年级分组，同一年级内按英文去重（保留首次出现）\nvar BY_GRADE = {};\nALL.forEach(function (word) {\n  if (!BY_GRADE[word.grade]) BY_GRADE[word.grade] = [];\n  var list = BY_GRADE[word.grade];\n  var dup = list.some(function (w) { return w.en.toLowerCase() === word.en.toLowerCase(); });\n  if (!dup) list.push(word);\n});\n\n// 按英文（不区分大小写）查词条\nvar INDEX = {};\nALL.forEach(function (word) {\n  var key = word.en.toLowerCase();\n  if (!INDEX[key]) INDEX[key] = word;\n});\n\nmodule.exports = {\n  GRADES: [3, 4, 5, 6],\n  ALL: ALL,\n  BOOKS: BOOKS,\n  BY_GRADE: BY_GRADE,\n  byGrade: function (grade) {\n    return BY_GRADE[grade] || [];\n  },\n  // 只含可图示词（有 emoji，可出图画块）\n  picturable: function (grade) {\n    return (BY_GRADE[grade] || []).filter(function (w) { return !!w.emoji; });\n  },\n  lookup: function (en) {\n    return INDEX[(en || '').toLowerCase()] || null;\n  },\n  countByGrade: function () {\n    var out = {};\n    Object.keys(BY_GRADE).forEach(function (g) { out[g] = BY_GRADE[g].length; });\n    return out;\n  }\n};\n","js/data/levels.js":"// 关卡生成：每个年级 8 关，目标词取自该年级词库，难度递增。\n// 难度维度：棋盘不同单词数 5->8、目标词个数 1->3、每个目标收集数递增、步数相对收紧。\nvar Words = require('./words.js');\n\nvar LEVELS_PER_GRADE = 8;\n\nfunction shuffle(arr, rng) {\n  var a = arr.slice();\n  for (var i = a.length - 1; i > 0; i--) {\n    var j = Math.floor(rng() * (i + 1));\n    var t = a[i]; a[i] = a[j]; a[j] = t;\n  }\n  return a;\n}\n\n// index: 0..7\nfunction getLevel(grade, index, rng) {\n  rng = rng || Math.random;\n  var poolAll = Words.byGrade(grade);\n  var picturable = poolAll.filter(function (w) { return !!w.emoji; });\n  var plain = poolAll.filter(function (w) { return !w.emoji; });\n\n  var distinctCount = 5 + Math.min(3, Math.floor(index / 2)); // 5,5,6,6,7,7,8,8\n  var shuffledPic = shuffle(picturable, rng);\n  var pool = shuffledPic.slice(0, distinctCount);\n  // 若可图示词不足（不会发生，防御性），用普通词补齐\n  if (pool.length < distinctCount) {\n    pool = pool.concat(shuffle(plain, rng).slice(0, distinctCount - pool.length));\n  }\n\n  var targetCount = index < 2 ? 1 : (index < 5 ? 2 : 3);\n  var targets = shuffle(pool, rng).slice(0, targetCount).map(function (w) {\n    // 每个目标收集数 3~7，随关卡平缓增长（经模拟校准，保证小学生可通关）\n    return { en: w.en, need: 3 + Math.floor(index / 2) + Math.floor(rng() * 2) };\n  });\n\n  var moves = 18 + index * 3; // 18..39 步\n\n  return {\n    grade: grade,\n    index: index,\n    levelNo: index + 1,\n    pool: pool,               // 本关棋盘词池（词条数组）\n    targets: targets,         // [{en, need}]\n    moves: moves\n  };\n}\n\n// 星级：过关 1 星；剩余步数 >= 20% 加 1 星；>= 40% 再加 1 星\nfunction calcStars(movesLeft, movesTotal) {\n  if (movesTotal <= 0) return 1;\n  var frac = movesLeft / movesTotal;\n  var stars = 1;\n  if (frac >= 0.2) stars++;\n  if (frac >= 0.4) stars++;\n  return stars;\n}\n\nmodule.exports = {\n  LEVELS_PER_GRADE: LEVELS_PER_GRADE,\n  getLevel: getLevel,\n  calcStars: calcStars\n};\n","js/data/emoji-map.js":"// 单词→emoji 对照（供图画块使用；词库本体在 data/db.json）\nmodule.exports = {\n \"hello\": \"👋\",\n \"hi\": \"👋\",\n \"goodbye\": \"🙋\",\n \"good\": \"👍\",\n \"fine\": \"🙂\",\n \"thanks\": \"🙏\",\n \"please\": \"🤲\",\n \"yes\": \"✅\",\n \"no\": \"❌\",\n \"ok\": \"👌\",\n \"red\": \"🔴\",\n \"yellow\": \"🟡\",\n \"blue\": \"🔵\",\n \"green\": \"🟢\",\n \"white\": \"⚪\",\n \"black\": \"⚫\",\n \"orange\": \"🟠\",\n \"pink\": \"🩷\",\n \"purple\": \"🟣\",\n \"brown\": \"🟤\",\n \"cat\": \"🐱\",\n \"dog\": \"🐶\",\n \"duck\": \"🦆\",\n \"pig\": \"🐷\",\n \"bird\": \"🐦\",\n \"panda\": \"🐼\",\n \"monkey\": \"🐵\",\n \"elephant\": \"🐘\",\n \"tiger\": \"🐯\",\n \"rabbit\": \"🐰\",\n \"bear\": \"🐻\",\n \"fish\": \"🐟\",\n \"cow\": \"🐮\",\n \"sheep\": \"🐑\",\n \"horse\": \"🐴\",\n \"chicken\": \"🐔\",\n \"mouse\": \"🐭\",\n \"snake\": \"🐍\",\n \"frog\": \"🐸\",\n \"lion\": \"🦁\",\n \"head\": \"🗣️\",\n \"eye\": \"👀\",\n \"ear\": \"👂\",\n \"nose\": \"👃\",\n \"mouth\": \"👄\",\n \"hand\": \"✋\",\n \"arm\": \"💪\",\n \"leg\": \"🦵\",\n \"foot\": \"🦶\",\n \"face\": \"😀\",\n \"hair\": \"💇\",\n \"finger\": \"👆\",\n \"one\": \"1️⃣\",\n \"two\": \"2️⃣\",\n \"three\": \"3️⃣\",\n \"four\": \"4️⃣\",\n \"five\": \"5️⃣\",\n \"six\": \"6️⃣\",\n \"seven\": \"7️⃣\",\n \"eight\": \"8️⃣\",\n \"nine\": \"9️⃣\",\n \"ten\": \"🔟\",\n \"father\": \"👨\",\n \"mother\": \"👩\",\n \"brother\": \"👦\",\n \"sister\": \"👧\",\n \"grandfather\": \"👴\",\n \"grandmother\": \"👵\",\n \"baby\": \"👶\",\n \"family\": \"👨‍👩‍👧\",\n \"friend\": \"🧑‍🤝‍🧑\",\n \"man\": \"👨\",\n \"woman\": \"👩\",\n \"children\": \"🧒\",\n \"egg\": \"🥚\",\n \"milk\": \"🥛\",\n \"bread\": \"🍞\",\n \"rice\": \"🍚\",\n \"cake\": \"🍰\",\n \"juice\": \"🧃\",\n \"water\": \"💧\",\n \"tea\": \"🍵\",\n \"coffee\": \"☕\",\n \"noodle\": \"🍜\",\n \"apple\": \"🍎\" ry\": \"📕\",\n \"magazine\": \"📰\",\n \"newspaper\": \"🗞️\",\n \"report\": \"📊\",\n \"uniform\": \"👔\",\n \"rule\": \"📏\",\n \"problem\": \"❗\",\n \"half\": \"½\",\n \"piano\": \"🎹\",\n \"ping-pong\": \"🏓\",\n \"tooth\": \"🦷\",\n \"dumpling\": \"🥟\",\n \"coconut\": \"🥥\",\n \"seed\": \"🌱\",\n \"lotus\": \"🪷\",\n \"waterfall\": \"🏞️\",\n \"raincoat\": \"🧥\",\n \"fog\": \"🌫️\",\n \"flood\": \"🌊\",\n \"fire\": \"🔥\",\n \"street\": \"🛣️\",\n \"station\": \"🚉\",\n \"traffic\": \"🚦\",\n \"beach\": \"🏖️\",\n \"desert\": \"🏜️\",\n \"grassland\": \"🌾\",\n \"koala\": \"🐨\",\n \"island\": \"🏝️\",\n \"camel\": \"🐪\",\n \"ice\": \"🧊\",\n \"turkey\": \"🦃\",\n \"party\": \"🎉\",\n \"christmas\": \"🎄\",\n \"skate\": \"⛸️\",\n \"sunshine\": \"☀️\",\n \"painting\": \"🎨\",\n \"hotel\": \"🏨\",\n \"night\": \"🌙\",\n \"house\": \"🏠\",\n \"rope\": \"🪢\",\n \"pumpkin\": \"🎃\",\n \"bamboo\": \"🎋\",\n \"restaurant\": \"🍽️\",\n \"airport\": \"✈️\",\n \"marathon\": \"🏃\",\n \"race\": \"🏁\",\n \"eiffel tower\": \"🗼\",\n \"holiday\": \"🌴\"\n};\n","js/engine/board.js":"// 消消乐核心引擎：纯逻辑，不依赖 Canvas / wx，可在 Node 中 require 测试。\n// 棋盘是 size×size 的二维数组 grid[r][c]，每个格子是一个块：\n//   { id: 'cat', kind: 'word' | 'pic' }\n// id 是单词的英文（同一单词的单词块与图画块 id 相同，可混搭计数消除）。\n\nvar SIZE = 6;\n\nfunction defaultRng() { return Math.random(); }\n\nfunction pick(arr, rng) {\n  return arr[Math.floor(rng() * arr.length)];\n}\n\n// 生成一个块：有 emoji 的词以约 45% 概率出图画块，否则出单词块\nfunction makeTile(word, rng) {\n  var kind = (word.emoji && rng() < 0.45) ? 'pic' : 'word';\n  return { id: word.en, kind: kind };\n}\n\nfunction cloneGrid(grid) {\n  return grid.map(function (row) {\n    return row.map(function (t) { return t ? { id: t.id, kind: t.kind } : null; });\n  });\n}\n\n// 查找所有 >=3 连线（横/竖），返回 { cells: [{r,c}...] 去重, groups: [{id, cells}] }\nfunction findMatches(grid) {\n  var size = grid.length;\n  var marked = {};\n  var groups = [];\n  function key(r, c) { return r + ',' + c; }\n  var r, c, len, i;\n  // 横向\n  for (r = 0; r < size; r++) {\n    c = 0;\n    while (c < size) {\n      if (!grid[r][c]) { c++; continue; }\n      len = 1;\n      while (c + len < size && grid[r][c + len] && grid[r][c + len].id === grid[r][c].id) len++;\n      if (len >= 3) {\n        var g = { id: grid[r][c].id, cells: [] };\n        for (i = 0; i < len; i++) { g.cells.push({ r: r, c: c + i }); marked[key(r, c + i)] = true; }\n        groups.push(g);\n      }\n      c += len;\n    }\n  }\n  // 纵向\n  for (c = 0; c < size; c++) {\n    r = 0;\n    while (r < size) {\n      if (!grid[r][c]) { r++; continue; }\n      len = 1;\n      while (r + len < size && grid[r + len][c] && grid[r + len][c].id === grid[r][c].id) len++;\n      if (len >= 3) {\n        var g2 = { id: grid[r][c].id, cells: [] };\n        for (i = 0; i < len; i++) { g2.cells.push({ r: r + i, c: c }); marked[key(r + i, c)] = true; }\n        groups.push(g2);\n      }\n      r += len;\n    }\n  }\n  var cells = Object.keys(marked).map(function (k) {\n    var p = k.split(',');\n    return { r: parseInt(p[0], 10), c: parseInt(p[1], 10) };\n  });\n  return { cells: cells, groups: groups };\n}\n\nfunction isAdjacent(a, b) {\n  return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;\n}\n\nfunction swapInPlace(grid, a, b) {\n  var t = grid[a.r][a.c];\n  grid[a.r][a.c] = grid[b.r][b.c];\n  grid[b.r][b.c] = t;\n}\n\n// 尝试交换：成功（能形成消除）返回 true 并保留交换；失败自动换回返回 false\nfunction trySwap(grid, a, b) {\n  if (!isAdjacent(a, b)) return false;\n  swapInPlace(grid, a, b);\n  var m = findMatches(grid);\n  if (m.cells.length === 0) {\n    swapInPlace(grid, a, b);\n    return false;\n  }\n  return true;\n}\n\n// 找一步可消除的交换（提示用）；找不到返回 null\nfunction findHint(grid) {\n  var size = grid.length;\n  var dirs = [{ r: 0, c: 1 }, { r: 1, c: 0 }];\n  for (var r = 0; r < size; r++) {\n    for (var c = 0; c < size; c++) {\n      for (var d = 0; d < dirs.length; d++) {\n        var nr = r + dirs[d].r, nc = c + dirs[d].c;\n        if (nr >= size || nc >= size) continue;\n        var a = { r: r, c: c }, b = { r: nr, c: nc };\n        swapInPlace(grid, a, b);\n        var ok = findMatches(grid).cells.length > 0;\n        swapInPlace(grid, a, b);\n        if (ok) return { a: a, b: b };\n      }\n    }\n  }\n  return null;\n}\n\nfunction hasAnyMove(grid) {\n  return !!findHint(grid);\n}\n\n// 生成初始棋盘：无现成消除、且至少有一步可走\nfunction createBoard(pool, size, rng) {\n  size = size || SIZE;\n  rng = rng || defaultRng;\n  var attempt, grid, r, c;\n  for (attempt = 0; attempt < 60; attempt++) {\n    grid = [];\n    for (r = 0; r < size; r++) {\n      grid.push([]);\n      for (c = 0; c < size; c++) {\n        var tile = null;\n        for (var tries = 0; tries < 20; tries++) {\n          tile = makeTile(pick(pool, rng), rng);\n          var badRow = c >= 2 && grid[r][c - 1].id === tile.id && grid[r][c - 2].id === tile.id;\n          var badCol = r >= 2 && grid[r - 1][c].id === tile.id && grid[r - 2][c].id === tile.id;\n          if (!badRow && !badCol) break;\n        }\n        grid[r].push(tile);\n      }\n    }\n    if (findMatches(grid).cells.length === 0 && hasAnyMove(grid)) return grid;\n  }\n  return grid; // 极小概率兜底\n}\n\n// 执行一步消除结算：找到匹配 -> 清除 -> 下落补齐。\n// chain 为连锁序号（从 1 开始），用于计分倍率。\n// 无匹配时返回 null；否则返回 { cleared: {en: 数量}, cells, score, groups }\nfunction resolveStep(grid, pool, rng, chain) {\n  rng = rng || defaultRng;\n  chain = chain || 1;\n  var m = findMatches(grid);\n  if (m.cells.length === 0) return null;\n  var cleared = {};\n  var score = 0;\n  m.groups.forEach(function (g) {\n    cleared[g.id] = (cleared[g.id] || 0) + g.cells.length;\n    score += g.cells.length * 10 + Math.max(0, g.cells.length - 3) * 10; // 4 连及以上额外奖励\n  });\n  score *= chain;\n  m.cells.forEach(function (cell) { grid[cell.r][cell.c] = null; });\n  // 下落 + 顶部补齐\n  var size = grid.length;\n  for (var c = 0; c < size; c++) {\n    var write = size - 1;\n    for (var r = size - 1; r >= 0; r--) {\n      if (grid[r][c]) {\n        grid[write][c] = grid[r][c];\n        if (write !== r) grid[r][c] = + w, y + r, r);\n  ctx.lineTo(x + w, y + h - r);\n  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);\n  ctx.lineTo(x + r, y + h);\n  ctx.arcTo(x, y + h, x, y + h - r, r);\n  ctx.lineTo(x, y + r);\n  ctx.arcTo(x, y, x + r, y, r);\n  ctx.closePath();\n}\n\n// 通用按钮：btn = {x,y,w,h,text,fill,color,fontSize,disabled}\nfunction drawButton(ctx, btn) {\n  ctx.save();\n  ctx.globalAlpha = btn.disabled ? 0.45 : 1;\n  ctx.fillStyle = btn.fill || '#FF8C42';\n  roundRect(ctx, btn.x, btn.y, btn.w, btn.h, btn.h / 2);\n  ctx.fill();\n  ctx.fillStyle = btn.color || '#FFFFFF';\n  ctx.font = 'bold ' + (btn.fontSize || 16) + 'px sans-serif';\n  ctx.textAlign = 'center';\n  ctx.textBaseline = 'middle';\n  ctx.fillText(btn.text, btn.x + btn.w / 2, btn.y + btn.h / 2 + 1);\n  ctx.restore();\n}\n\nfunction hit(btn, x, y) {\n  return x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h;\n}\n\n// 画一个棋盘块。tile={id,kind}；wordLookup(id) 返回词条（取 zh 用）。\n// opts: { selected, hinted, flash, scale }\nfunction drawTile(ctx, tile, word, x, y, size, opts) {\n  opts = opts || {};\n  var pad = 3;\n  var s = size * (opts.scale || 1);\n  var ox = x + (size - s) / 2, oy = y + (size - s) / 2;\n  ctx.save();\n  // 糖果底色（图画块用浅色底，单词块用饱和色底）\n  ctx.fillStyle = tile.kind === 'pic' ? '#FFF7E6' : colorFor(tile.id);\n  roundRect(ctx, ox + pad, oy + pad, s - pad * 2, s - pad * 2, 12);\n  ctx.fill();\n  if (opts.flash) {\n    ctx.fillStyle = 'rgba(255,255,255,0.65)';\n    roundRect(ctx, ox + pad, oy + pad, s - pad * 2, s - pad * 2, 12);\n    ctx.fill();\n  }\n  if (tile.kind === 'pic') {\n    ctx.strokeStyle = colorFor(tile.id);\n    ctx.lineWidth = 2;\n    roundRect(ctx, ox + pad, oy + pad, s - pad * 2, s - pad * 2, 12);\n    ctx.stroke();\n    ctx.font = Math.floor(s * 0.52) + 'px sans-serif';\n    ctx.textAlign = 'center';\n    ctx.textBaseline = 'middle';\n    ctx.fillText(word ? word.emoji : '❓', ox + s / 2, oy + s / 2 + 2);\n  } else {\n    ctx.fillStyle = '#FFFFFF';\n    ctx.textAlign = 'center';\n    ctx.textBaseline = 'middle';\n    var en = tile.id;\n    var fontSize = Math.floor(s * (en.length > 7 ? 0.19 : en.length > 5 ? 0.23 : 0.28));\n    ctx.font = 'bold ' + fontSize + 'px sans-serif';\n    ctx.fillText(en, ox + s / 2, oy + s / 2 - s * 0.08);\n    if (word && word.zh) {\n      ctx.font = Math.floor(s * 0.17) + 'px sans-serif';\n      ctx.globalAlpha = 0.9;\n      ctx.fillText(word.zh, ox + s / 2, oy + s / 2 + s * 0.22);\n      ctx.globalAlpha = 1;\n    }\n  }\n  if (opts.selected) {\n    ctx.strokeStyle = '#FFF3BF';\n    ctx.lineWidth = 4;\n    roundRect(ctx, ox + 2, oy + 2, s - 4, s - 4, 12);\n    ctx.stroke();\n  } else if (opts.hinted) {\n    ctx.strokeStyle = '#FF922B';\n    ctx.lineWidth = 3;\n    roundRect(ctx, ox + 2, oy + 2, s - 4, s - 4, 12);\n    ctx.stroke();\n  }\n  ctx.restore();\n}\n\n// 简单 Canvas 橘猫老师：橙色圆脸 + 三角耳 + 胡须 + 眼镜\nfunction drawCat(ctx, cx, cy, radius) {\n  ctx.save();\n  // 耳朵\n  ctx.fillStyle = '#F08C00';\n  ctx.beginPath();\n  ctx.moveTo(cx - radius * 0.78, cy - radius * 0.45);\n  ctx.lineTo(cx - radius * 0.95, cy - radius * 1.05);\n  ctx.lineTo(cx - radius * 0.3, cy - radius * 0.82);\n  ctx.closePath();\n  ctx.fill();\n  ctx.beginPath();\n  ctx.moveTo(cx + radius * 0.78, cy - radius * 0.45);\n  ctx.lineTo(cx + radius * 0.95, cy - radius * 1.05);\n  ctx.lineTo(cx + radius * 0.3, cy - radius * 0.82);\n  ctx.closePath();\n  ctx.fill();\n  // 脸\n  ctx.fillStyle = '#FFA94D';\n  ctx.beginPath();\n  ctx.arc(cx, cy, radius, 0, Math.PI * 2);\n  ctx.fill();\n  // 条纹\n  ctx.strokeStyle = '#F08C00';\n  ctx.lineWidth = radius * 0.09;\n  ctx.beginPath();\n  ctx.moveTo(cx - radius * 0.25, cy - radius * 0.95);\n  ctx.lineTo(cx - radius * 0.2, cy - radius * 0.6);\n  ctx.moveTo(cx + radius * 0.05, cy - radius * 1.0);\n  ctx.lineTo(cx + radius * 0.08, cy - radius * 0.62);\n  ctx.moveTo(cx + radius * 0.35, cy - radius * 0.9);\n  ctx.lineTo(cx + radius * 0.32, cy - radius * 0.58);\n  ctx.stroke();\n  // 眼睛\n  ctx.fillStyle = '#343A40';\n  ctx.beginPa  ctx.textAlign = 'center';\n  ctx.textBaseline = 'middle';\n  for (var i = 0; i < total; i++) {\n    ctx.fillStyle = i < filled ? '#FFD43B' : '#DEE2E6';\n    ctx.fillText('★', startX + gap * i, cy);\n  }\n  ctx.restore();\n}\n\nmodule.exports = {\n  PALETTE: PALETTE,\n  colorFor: colorFor,\n  roundRect: roundRect,\n  drawButton: drawButton,\n  hit: hit,\n  drawTile: drawTile,\n  drawCat: drawCat,\n  drawStars: drawStars\n};\n","data/db.json":"[\r\n  {\r\n    \"u\": 1,\r\n    \"t\": \"Making friends\",\r\n    \"z\": \"交朋友\",\r\n    \"w\": [\r\n      [\"name\", \"名字\"],\r\n      [\"nice\", \"令人愉快的；友好的\"],\r\n      [\"ear\", \"耳朵\"],\r\n      [\"hand\", \"手\"],\r\n      [\"eye\", \"眼睛\"],\r\n      [\"mouth\", \"嘴\"],\r\n      [\"arm\", \"胳膊\"],\r\n      [\"can\", \"可以；能够\"],\r\n      [\"share\", \"分享\"],\r\n      [\"smile\", \"微笑；笑\"],\r\n      [\"listen\", \"听；倾听\"],\r\n      [\"help\", \"帮助\"],\r\n      [\"say\", \"说；讲\"],\r\n      [\"friend\", \"朋友\"],\r\n      [\"good\", \"好的\"]\r\n    ]\r\n  },\r\n  {\r\n    \"u\": 2,\r\n    \"t\": \"Different families\",\r\n    \"z\": \"不同的家庭\",\r\n    \"w\": [\r\n      [\"mum\", \"（口语）妈妈\"],\r\n      [\"dad\", \"（口语）爸爸\"],\r\n      [\"grandma\", \"奶奶；姥姥\"],\r\n      [\"grandpa\", \"爷爷；姥爷\"],\r\n      [\"grandfather\", \"（外）祖父\"],\r\n      [\"grandmother\", \"（外）祖母\"],\r\n      [\"mother\", \"母亲；妈妈\"],\r\n      [\"father\", \"父亲；爸爸\"],\r\n      [\"me\", \"我\"],\r\n      [\"sister\", \"姐；妹\"],\r\n      [\"family\", \"家；家庭\"],\r\n      [\"have\", \"有\"],\r\n      [\"big\", \"大的\"],\r\n      [\"cousin\", \"堂（表）兄弟/姐妹\"],\r\n      [\"brother\", \"哥；弟\"],\r\n      [\"baby\", \"婴儿\"],\r\n      [\"uncle\", \"伯父；叔父；舅父\"],\r\n      [\"aunt\", \"伯母；婶母；舅母\"],\r\n      [\"small\", \"小的\"]\r\n    ]\r\n  },\r\n  {\r\n    \"u\": 3,\r\n    \"t\": \"Amazing animals\",\r\n    \"z\": \"奇妙的动物\",\r\n    \"w\": [\r\n      [\"like\", \"喜欢\"],\r\n      [\"dog\", \"狗\"],\r\n      [\"pet\", \"宠物\"],\r\n      [\"cat\", \"猫\"],\r\n      [\"fish\", \"鱼；鱼肉\"],
