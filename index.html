<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Word Pop 英语单词消消乐 · 浏览器预览</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #BDE7FF; overflow: hidden; }
  #game { display: block; touch-action: none; }
  #tip {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 4px 8px;
    font: 12px sans-serif; color: #999; text-align: center; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="tip">在线预览版 · Word Pop 英语消消乐（进度保存在本机浏览器）</div>
<script>
(function () {
  var canvas = document.getElementById('game');

  function sizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    // main.js 会按 windowWidth*pixelRatio 再设置一次宽高
  }
  sizeCanvas();

  // ---------- 极简 wx shim ----------
  var touchHandler = null;
  window.wx = {
    createCanvas: function () { return canvas; },
    getSystemInfoSync: function () {
      return {
        windowWidth: window.innerWidth,
        windowHeight: window.innerHeight,
        pixelRatio: window.devicePixelRatio || 1
      };
    },
    onTouchStart: function (fn) { touchHandler = fn; },
    setStorageSync: function (key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    },
    getStorageSync: function (key) {
      var raw = localStorage.getItem(key);
      if (raw === null) return '';
      try { return JSON.parse(raw); } catch (e) { return ''; }
    }
  };

  function fireTouch(clientX, clientY) {
    if (touchHandler) touchHandler({ touches: [{ clientX: clientX, clientY: clientY }] });
  }
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    fireTouch(t.clientX, t.clientY);
  }, { passive: false });
  canvas.addEventListener('mousedown', function (e) {
    fireTouch(e.clientX, e.clientY);
  });

  // ---------- 极简 CommonJS loader（同步 XHR，需 http(s) 打开） ----------
  var FILES = {"game.js":"// 微信小游戏入口\nvar Main = require('./js/main.js');\n\nMain.start();\n","js/main.js":"// 主逻辑：界面状态机（首页 / 游戏 / 结算 / 单词本）、触摸、连锁结算、进度存档。\nvar Board = require('./engine/board.js');\nvar Words = require('./data/words.js');\nvar Levels = require('./data/levels.js');\nvar R = require('./render/render.js');\nvar Speak = require('./audio/speak.js');\n\nvar STORAGE_KEY = 'wordpop-progress-v1';\n\nvar canvas, ctx, W = 375, H = 667, DPR = 1;\n\nvar state = {\n  screen: 'home', // home | game | result | wordbook\n  grade: 3,\n  progress: null,\n  buttons: [],\n  // game\n  level: null,\n  grid: null,\n  poolMap: {},\n  selected: null,\n  hintPair: null,\n  flashCells: null,\n  busy: false,\n  movesLeft: 0,\n  score: 0,\n  targetProgress: {}, // en -> collected count\n  learned: {},         // en -> true（本关消除过的词）\n  message: '',\n  // result\n  result: null,\n  // wordbook\n  wbGrade: 3,\n  wbPage: 0\n};\n\n// ---------- 存档 ----------\nfunction defaultProgress() {\n  return { unlocked: { 3: 1, 4: 1, 5: 1, 6: 1 }, stars: {}, collected: [] };\n}\nfunction loadProgress() {\n  try {\n    var p = wx.getStorageSync(STORAGE_KEY);\n    if (p && typeof p === 'object' && p.unlocked) {\n      var d = defaultProgress();\n      Object.keys(d.unlocked).forEach(function (g) {\n        if (typeof p.unlocked[g] === 'number') d.unlocked[g] = p.unlocked[g];\n      });\n      d.stars = p.stars || {};\n      d.collected = p.collected || [];\n      return d;\n    }\n  } catch (e) { /* 忽略，走默认 */ }\n  return defaultProgress();\n}\nfunction saveProgress() {\n  try { wx.setStorageSync(STORAGE_KEY, state.progress); } catch (e) { /* 忽略 */ }\n}\n\n// ---------- 工具 ----------\nfunction text(str, x, y, size, color, align, bold) {\n  ctx.fillStyle = color || '#343A40';\n  ctx.font = (bold ? 'bold ' : '') + size + 'px ' + R.FONT;\n  ctx.textAlign = align || 'center';\n  ctx.textBaseline = 'middle';\n  ctx.fillText(str, x, y);\n}\nfunction addButton(x, y, w, h, label, action, opts) {\n  opts = opts || {};\n  var btn = {\n    x: x, y: y, w: w, h: h, text: label, action: action,\n    fill: opts.fill || '#FF8C42', color: opts.color || '#FFFFFF',\n    fontSize: opts.fontSize || 16, disabled: !!opts.disabled\n  };\n  state.buttons.push(btn);\n  return btn;\n}\nfunction wordOf(en) {\n  return state.poolMap[en] || Words.lookup(en);\n}\n\n// ---------- 关卡 ----------\nfunction startLevel(grade, index) {\n  var level = Levels.getLevel(grade, index);\n  state.level = level;\n  state.poolMap = {};\n  level.pool.forEach(function (w) { state.poolMap[w.en] = w; });\n  state.grid = Board.createBoard(level.pool, Board.SIZE);\n  state.movesLeft = level.moves;\n  state.score = 0;\n  state.selected = null;\n  state.hintPair = null;\n  state.flashCells = null;\n  state.busy = false;\n  state.targetProgress = {};\n  level.targets.forEach(function (t) { state.targetProgress[t.en] = 0; });\n  state.learned = {};\n  state.message = '把相同的单词连成 3 个以上消除！';\n  state.screen = 'game';\n  draw();\n}\n\nfunction targetsDone() {\n  return state.level.targets.every(function (t) {\n    return (state.targetProgress[t.en] || 0) >= t.need;\n  });\n}\n\nfunction finishLevel(win) {\n  var level = state.level;\n  var stars = 0;\n  if (win) {\n    stars = Levels.calcStars(state.movesLeft, level.moves);\n    var key = level.grade + '-' + level.index;\n    if (!state.progress.stars[key] || state.progress.stars[key] < stars) {\n      state.progress.stars[key] = stars;\n    }\n    var unlocked = state.progress.unlocked[level.grade] || 1;\n    state.progress.unlocked[level.grade] = Math.min(Levels.LEVELS_PER_GRADE, Math.max(unlocked, level.index + 2));\n    Object.keys(state.learned).forEach(function (en) {\n      if (state.progress.collected.indexOf(en) < 0) state.progress.collected.push(en);\n    });\n    saveProgress();\n  }\n  var learnedWords = Object.keys(state.learned).map(function (en) { return wordOf(en); }).filter(Boolean);\n  learnedWords.sort(function (a, b) {\n    var at = state.level.targets.some(function (t) { return t.en === a.en; }) ? 0 : 1;\n    var bt = state.level.targets.some(function (t) { return t.en === b.en; }) ? 0 : 1;\n    return at - bt;\n  });\n  state.result = { win: win, stars: stars, score: state.score, learned: learnedWords };\n  state.screen = 'result';\n  draw();\n}\n\n// 一次交换后的连锁结算（分步进行，先闪烁再消除，便于看清）\nfunction runCascade(chain) {\n  var m = Board.findMatches(state.grid);\n  if (m.cells.length === 0) {\n    state.flashCells = null;\n    state.busy = false;\n    if (targetsDone()) { finishLevel(true); return; }\n    if (state.movesLeft <= 0) { finishLevel(false); return; }\n    if (!Board.hasAnyMove(state.grid)) {\n      Board.reshuffle(state.grid, state.level.pool);\n      state.message = '没有可走的步，已自动洗牌！';\n    }\n    draw();\n    return;\n  }\n  state.flashCells = m.cells;\n  draw();\n  setTimeout(function () {\n    var step = Board.resolveStep(state.grid, state.level.pool, Math.random, chain);\n    if (step) {\n      state.score += step.score;\n      Object.keys(step.cleared).forEach(function (en) {\n        state.learned[en] = true;\n        if (typeof state.targetProgress[en] === 'number') {\n          state.targetProgress[en] += step.cleared[en];\n        }\n      });\n    }\n    state.flashCells = null;\n    draw();\n    setTimeout(function () { runCascade(chain + 1); }, 90);\n  }, 240);\n}\n\nfunction onTileTap(r, c) {\n  if (state.busy) return;\n  state.hintPair = null;\n  var cell = { r: r, c: c };\n  if (!state.selected) {\n    state.selected = cell;\n    draw();\n    return;\n  }\n  if (state.selected.r === r && state.selected.c === c) {\n    state.selected = null;\n    draw();\n    return;\n  }\n  if (!Board.isAdjacent(state.selected, cell)) {\n    state.selected = cell;\n    draw();\n    return;\n  }\n  var a = state.selected;\n  state.selected = null;\n  // 先直观地交换，再由引擎校验（引擎失败会自动换回）\n  var ok = Board.trySwap(state.grid, a, cell);\n  if (!ok) {\n    state.message = '这样连不成 3 个，再试试！';\n    draw();\n    return;\n  }\n  state.movesLeft--;\n  state.busy = true;\n  state.message = '';\n  draw();\n  setTimeout(function () { runCascade(1); }, 120);\n}\n\n// ---------- 布局 ----------\nfunction boardGeom() {\n  var size = Math.min(W - 24, H * 0.52);\n  return { x: (W - size) / 2, y: 168, size: size, cell: size / Board.SIZE };\n}\n\n// ---------- 各界面绘制 ----------\nfunction drawBackground(kind) {\n  R.drawBackground(ctx, W, H, kind || 'sky');\n}\n\nfunction drawHome() {\n  drawBackground('sky');\n  state.buttons = [];\n  R.drawCat(ctx, W / 2, 104, 54, { glasses: true });\n  // 大标题：橙字白描边\n  ctx.save();\n  ctx.font = 'bold 36px ' + R.FONT;\n  ctx.textAlign = 'center';\n  ctx.textBaseline = 'middle';\n  ctx.lineWidth = 7;\n  ctx.strokeStyle = '#FFFFFF';\n  ctx.lineJoin = 'round';\n  ctx.strokeText('Word Pop', W / 2, 180);\n  ctx.fillStyle = '#FF7B1C';\n  ctx.fillText('Word Pop', W / 2, 180);\n  ctx.restore();\n  // 副标题胶囊\n  R.drawCapsule(ctx, W / 2 - 92, 202, 184, 28, '#E5DBFF', '#B197FC');\n  text('英 语 单 词 消 消 乐', W / 2, 216, 15, '#5F3DC4', 'center', true);\n\n  // 年级选择\n  var grades = Words.GRADES;\n  var tabW = (W - 48 - 3 * 8) / 4;\n  grades.forEach(function (g, i) {\n    var x = 24 + i * (tabW + 8);\n    addButton(x, 244, tabW, 40, g + ' 年级', 'grade:' + g, {\n      fill: state.grade === g ? '#FF922B' : '#FFFFFF',\n      color: state.grade === g ? '#FFFFFF' : '#8A5A2B',\n      fontSize: 15\n    });\n  });\n\n  // 开始按钮：进入当前年级第一个未通关关卡（全部通关则进最后一关）\n  var unlocked = state.progress.unlocked[state.grade] || 1;\n  var startIndex = unlocked - 1;\n  for (var i = 0; i < unlocked; i++) {\n    if (!state.progress.stars[state.grade + '-' + i]) { startIndex = i; break; }\n    startIndex = i;\n  }\n  addButton(W / 2 - 90, 300, 180, 52, '▶ 开始游戏', 'start', { fill: '#40C057', fontSize: 20 });\n\n  // 关卡格子（糖果卡）\n  text('选择关卡', 24, 386, 15, '#5F3DC4', 'left', true);\n  var cols = 4, cellW = (W - 48 - (cols - 1) * 10) / cols, cellH = 62;\n  for (var lv = 0; lv < Levels.LEVELS_PER_GRADE; lv++) {\n    var cx = 24 + (lv % cols) * (cellW + 10);\n    var cy = 404 + Math.floor(lv / cols) * (cellH + 10);\n    var locked = lv >= unlocked;\n    var st = state.progress.stars[state.grade + '-' + lv] || 0;\n    if (locked) {\n      ctx.save();\n      ctx.fillStyle = '#DEE2E6';\n      R.roundRect(ctx, cx, cy, cellW, cellH, 14);\n      ctx.fill();\n      ctx.setLineDash([5, 4]);\n      ctx.strokeStyle = '#ADB5BD';\n      ctx.lineWidth = 1.5;\n      R.roundRect(ctx, cx + 2, cy + 2, cellW - 4, cellH - 4, 12);\n      ctx.stroke();\n      ctx.restore();\n      text('🔒', cx + cellW / 2, cy + 22, 17, '#868E96');\n      text('第 ' + (lv + 1) + ' 关', cx + cellW / 2, cy + 45, 12, '#868E96', 'center', true);\n    } else {\n      var pal = R.paletteFor('level-' + lv);\n      ctx.save();\n      ctx.shadowColor = 'rgba(80, 55, 130, 0.18)';\n      ctx.shadowBlur = 6;\n      ctx.shadowOffsetY = 3;\n      var cg = ctx.createLinearGradient(cx, cy, cx, cy + cellH);\n      cg.addColorStop(0, pal.light);\n      cg.addColorStop(1, R.tint(pal.base, 0.25));\n      ctx.fillStyle = cg;\n      R.roundRect(ctx, cx, cy, cellW, cellH, 14);\n      ctx.fill();\n      ctx.restore();\n      ctx.save();\n      ctx.fillStyle = 'rgba(255,255,255,0.5)';\n      ctx.beginPath();\n      ctx.ellipse(cx + cellW / 2, cy + 9, cellW * 0.32, 5, 0, 0, Math.PI * 2);\n      ctx.fill();\n      ctx.restore();\n      text('第 ' + (lv + 1) + ' 关', cx + cellW / 2, cy + 21, 15, pal.dark, 'center', true);\n      R.drawStars(ctx, cx + cellW / 2, cy + 44, st, 3, 15);\n      state.buttons.push({ x: cx, y: cy, w: cellW, h: cellH, text: '', action: 'level:' + lv, fill: 'transparent', color: 'transparent', fontSize: 1, disabled: false, invisible: true });\n    }\n  }\n\n  addButton(W / 2 - 70, 404 + 2 * (cellH + 10) + 14, 140, 44, '📖 单词本', 'wordbook', { fill: '#4DABF7', fontSize: 17 });\n  var collectedCount = state.progress.collected.length;\n  text('已收集 ' + collectedCount + ' 个单词', W / 2, H - 26, 13, '#5B4A8A');\n}\n\nfunction drawGame() {\n  drawBackground('sky');\n  state.buttons = [];\n  var level = state.level;\n  addButton(12, 12, 44, 36, '←', 'home', { fill: '#FFFFFF', color: '#E8590C', fontSize: 18 });\n\n  // 顶栏三胶囊：关卡（黄）/ 得分（粉）/ 步数（青）\n  R.drawCapsule(ctx, 64, 10, 130, 38, '#FFE066', '#FFC300');\n  R.drawStar(ctx, 82, 29, 19, true);\n  text(level.grade + ' 年级 · 第 ' + level.levelNo + ' 关', 136, 29, 13, '#7A4D00', 'center', true);\n  R.drawCapsule(ctx, 202, 10, 82, 38, '#FFD6E8', '#FFA8CC');\n  text('得分 ' + state.score, 243, 29, 13, '#A61E4D', 'center', true);\n  var lowMoves = state.movesLeft <= 5;\n  R.drawCapsule(ctx, 292, 10, 71, 38, lowMoves ? '#FFC9C9' : '#C3FAE8', lowMoves ? '#FF8787' : '#63E6BE');\n  text('步数 ' + state.movesLeft, 327, 29, 13, lowMoves ? '#C92A2A' : '#087F5B', 'center', true);\n\n  // 目标面板（奶黄卡片 + 每目标一个彩色胶囊）\n  R.drawPanel(ctx, 16, 58, W - 32, 92, '#FFF9DB', 16);\n  text('收集目标', 30, 76, 13, '#8A6D00', 'left', true);\n  var tw = (W - 64) / Math.max(1, level.targets.length);\n  level.targets.forEach(function (t, i) {\n    var w = wordOf(t.en);\n    var got = Math.min(state.targetProgress[t.en] || 0, t.need);\n    var done = got >= t.need;\n    var capX = 32 + tw * i + 4, capW = tw - 8;\n    var pal = R.paletteFor(t.en);\n    if (done) R.drawCapsule(ctx, capX, 96, capW, 46, '#B2F2BB', '#51CF66');\n    else R.drawCapsule(ctx, capX, 96, capW, 46, pal.light, R.tint(pal.base, 0.35));\n    var cx = capX + capW / 2;\n    text((w && w.emoji ? w.emoji + ' ' : '') + t.en, cx, 112, 14, done ? '#1E6B2E' : pal.dark, 'center', true);\n    text(got + ' / ' + t.need, cx, 130, 12, done ? '#1E6B2E' : '#5B4A8A');\n    if (done) R.drawCheck(ctx, capX + capW - 11, 96 + 11, 9);\n  });\n\n  // 棋盘（白色圆角面板衬底）\n  var g = boardGeom();\n  R.drawPanel(ctx, g.x - 6, g.y - 6, g.size + 12, g.size + 12, '#FFFFFF', 18);\n  var flashMap = {};\n  (state.flashCells || []).forEach(function (cell) { flashMap[cell.r + ',' + cell.c] = true; });\n  for (var r = 0; r < Board.SIZE; r++) {\n    for (var c = 0; c < Board.SIZE; c++) {\n      var tile = state.grid[r][c];\n      if (!tile) continue;\n      var opts = {\n        selected: state.selected && state.selected.r === r && state.selected.c === c,\n        flash: !!flashMap[r + ',' + c],\n        hinted: state.hintPair && ((state.hintPair.a.r === r && state.hintPair.a.c === c) || (state.hintPair.b.r === r && state.hintPair.b.c === c))\n      };\n      R.drawTile(ctx, tile, wordOf(tile.id), g.x + c * g.cell, g.y + r * g.cell, g.cell, opts);\n    }\n  }\n\n  // 底部紫色圆角条：提示按钮 + 消息 + 橘猫\n  var barY = g.y + g.size + 12;\n  ctx.save();\n  ctx.shadowColor = 'rgba(80, 55, 130, 0.20)';\n  ctx.shadowBlur = 8;\n  ctx.shadowOffsetY = 3;\n  var bg2 = ctx.createLinearGradient(0, barY, 0, H - 8);\n  bg2.addColorStop(0, '#B197FC');\n  bg2.addColorStop(1, '#9775FA');\n  ctx.fillStyle = bg2;\n  R.roundRect(ctx, 8, barY, W - 16, H - barY - 8, 20);\n  ctx.fill();\n  ctx.restore();\n  addButton(W / 2 - 60, g.y + g.size + 22, 120, 42, '💡 提示', 'hint', { fill: '#FFD43B', color: '#664D03', fontSize: 16 });\n  if (state.message) text(state.message, W / 2, g.y + g.size + 88, 14, '#FFF3BF');\n  R.drawCat(ctx, W - 44, H - 40, 26);\n}\n\nfunction drawResult() {\n  drawBackground('mint');\n  state.buttons = [];\n  var res = state.result;\n  var level = state.level;\n\n  // 大标题：粗体橙字白描边\n  ctx.save();\n  ctx.font = 'bold 31px ' + R.FONT;\n  ctx.textAlign = 'center';\n  ctx.textBaseline = 'middle';\n  ctx.lineWidth = 7;\n  ctx.strokeStyle = '#FFFFFF';\n  ctx.lineJoin = 'round';\n  ctx.strokeText(res.win ? '过关啦！' : '差一点点！', W / 2, 50);\n  ctx.fillStyle = res.win ? '#FF7B1C' : '#868E96';\n  ctx.fillText(res.win ? '过关啦！' : '差一点点！', W / 2, 50);\n  ctx.restore();\n\n  if (res.win) R.drawStars(ctx, W / 2, 94, res.stars, 3, 40);\n  R.drawCat(ctx, W / 2, 168, 46, { glasses: true, cap: res.win, thumb: res.win });\n\n  // 黄色绶带横幅\n  ctx.save();\n  ctx.fillStyle = '#F59F00';\n  ctx.beginPath();\n  ctx.moveTo(W / 2 - 104, 222); ctx.lineTo(W / 2 - 134, 217); ctx.lineTo(W / 2 - 125, 233);\n  ctx.lineTo(W / 2 - 134, 249); ctx.lineTo(W / 2 - 104, 244);\n  ctx.closePath(); ctx.fill();\n  ctx.beginPath();\n  ctx.moveTo(W / 2 + 104, 222); ctx.lineTo(W / 2 + 134, 217); ctx.lineTo(W / 2 + 125, 233);\n  ctx.lineTo(W / 2 + 134, 249); ctx.lineTo(W / 2 + 104, 244);\n  ctx.closePath(); ctx.fill();\n  var rg = ctx.createLinearGradient(0, 216, 0, 250);\n  rg.addColorStop(0, '#FFE066');\n  rg.addColorStop(1, '#FFC300');\n  ctx.fillStyle = rg;\n  R.roundRect(ctx, W / 2 - 108, 216, 216, 34, 10);\n  ctx.fill();\n  ctx.restore();\n  text(res.win ? '太棒了！' : '继续加油！', W / 2, 233, 18, '#8A5A00', 'center', true);\n\n  text('得分 ' + res.score, W / 2, 268, 16, '#087F5B', 'center', true);\n\n  // 学到的单词卡片（整行可点 = 朗读该词）\n  var shown = res.learned.slice(0, 6);\n  var extra = res.learned.length - shown.length;\n  var cardX = 20, cardY = 284, cardW = W - 40;\n  var cardH = res.learned.length === 0 ? 78 : 42 + shown.length * 40 + (extra > 0 ? 18 : 0);\n  R.drawPanel(ctx, cardX, cardY, cardW, cardH, '#FFFFFF', 18);\n  text('本关学到的单词', cardX + 16, cardY + 21, 14, '#5F3DC4', 'left', true);\n  if (res.learned.length === 0) {\n    text('（本关还没有消除单词）', W / 2, cardY + 54, 13, '#ADB5BD');\n  }\n  shown.forEach(function (w, i) {\n    var x = cardX + 8, y = cardY + 42 + i * 40, rw = cardW - 16, rh = 36;\n    var pal = R.paletteFor(w.en);\n    ctx.fillStyle = pal.light;\n    R.roundRect(ctx, x, y, rw, rh, 10);\n    ctx.fill();\n    var cy = y + rh / 2;\n    text(w.emoji || '🔤', x + 24, cy, 20, '#343A40');\n    ctx.save();\n    ctx.fillStyle = '#343A40';\n    ctx.font = 'bold 15px ' + R.FONT;\n    ctx.textAlign = 'left';\n    ctx.textBaseline = 'middle';\n    ctx.fillText(w.en, x + 44, cy);\n    var enW = ctx.measureText(w.en).width;\n    ctx.restore();\n    if (w.zh) text(w.zh, x + 50 + enW, cy, 12, '#868E96', 'left');\n    R.drawSpeaker(ctx, x + rw - 56, cy, 12, '#4DABF7');\n    R.drawCheck(ctx, x + rw - 24, cy, 12);\n    state.buttons.push({ x: x, y: y, w: rw, h: rh, text: '', action: 'speak:' + w.en, fill: 'transparent', color: 'transparent', fontSize: 1, disabled: false, invisible: true });\n  });\n  if (extra > 0) {\n    text('还有 ' + extra + ' 个词已收进单词本', W / 2, cardY + 42 + shown.length * 40 + 8, 11, '#ADB5BD');\n  }\n\n  var btnY = cardY + cardH + 12;\n  addButton(32, btnY, (W - 76) / 2, 46, '↻ 再来一局', 'retry', { fill: '#4DABF7', fontSize: 16 });\n  if (res.win && level.index < Levels.LEVELS_PER_GRADE - 1) {\n    addButton(44 + (W - 76) / 2, btnY, (W - 76) / 2, 46, '下一关 ▶', 'next', { fill: '#40C057', fontSize: 16 });\n  } else {\n    addButton(44 + (W - 76) / 2, btnY, (W - 76) / 2, 46, '🏠 回首页', 'home', { fill: '#FF922B', fontSize: 16 });\n  }\n}\n\nfunction drawWordbook() {\n  drawBackground('lavender');\n  state.buttons = [];\n  // 黄色标题栏（圆形返回钮在左、橘猫在右）\n  ctx.save();\n  ctx.shadowColor = 'rgba(80, 55, 130, 0.18)';\n  ctx.shadowBlur = 8;\n  ctx.shadowOffsetY = 3;\n  var tg = ctx.createLinearGradient(0, 8, 0, 58);\n  tg.addColorStop(0, '#FFF3BF');\n  tg.addColorStop(1, '#FFE066');\n  ctx.fillStyle = tg;\n  R.roundRect(ctx, 10, 8, W - 20, 50, 16);\n  ctx.fill();\n  ctx.restore();\n  addButton(12, 12, 44, 36, '←', 'home', { fill: '#E5DBFF', color: '#5F3DC4', fontSize: 18 });\n  text('我的单词本', W / 2, 33, 20, '#5F3DC4', 'center', true);\n  R.drawCat(ctx, W - 36, 33, 15);\n\n  var tabW = (W - 48 - 3 * 8) / 4;\n  Words.GRADES.forEach(function (g, i) {\n    var x = 24 + i * (tabW + 8);\n    addButton(x, 68, tabW, 36, g + ' 年级', 'wbgrade:' + g, {\n      fill: state.wbGrade === g ? '#9775FA' : '#FFFFFF',\n      color: state.wbGrade === g ? '#FFFFFF' : '#5F3DC4',\n      fontSize: 14\n    });\n  });\n\n  var collectedSet = {};\n  state.progress.collected.forEach(function (en) { collectedSet[en] = true; });\n  var words = Words.byGrade(state.wbGrade);\n  var collectedCount = words.filter(function (w) { return collectedSet[w.en]; }).length;\n\n  // 进度胶囊：星星 + 已收集 x/y + 黄色进度条\n  R.drawPanel(ctx, 20, 114, W - 40, 40, '#FFFFFF', 20);\n  R.drawStar(ctx, 44, 134, 22, true);\n  text('已收集 ' + collectedCount + ' / ' + words.length, 60, 134, 14, '#5F3DC4', 'left', true);\n  var barX = 200, barW = W - 40 - 200 + 20 - 16;\n  ctx.fillStyle = '#E5DBFF';\n  R.roundRect(ctx, barX, 127, barW, 14, 7);\n  ctx.fill();\n  if (words.length > 0 && collectedCount > 0) {\n    var fw = Math.max(14, barW * collectedCount / words.length);\n    var pg = ctx.createLinearGradient(barX, 127, barX, 141);\n    pg.addColorStop(0, '#FFE066');\n    pg.addColorStop(1, '#FFC300');\n    ctx.fillStyle = pg;\n    R.roundRect(ctx, barX, 127, fw, 14, 7);\n    ctx.fill();\n  }\n\n  var perPage = 10;\n  var pages = Math.max(1, Math.ceil(words.length / perPage));\n  if (state.wbPage >= pages) state.wbPage = pages - 1;\n  var pageWords = words.slice(state.wbPage * perPage, state.wbPage * perPage + perPage);\n\n  if (pageWords.length === 0) {\n    R.drawCat(ctx, W / 2, 260, 44);\n    text('这个年级还没有单词', W / 2, 340, 15, '#868E96');\n  } else {\n    pageWords.forEach(function (w, i) {\n      var col = i % 2, row = Math.floor(i / 2);\n      var x = 20 + col * ((W - 48) / 2 + 8), y = 166 + row * 68;\n      var cw = (W - 48) / 2, ch = 60;\n      var cy = y + ch / 2;\n      if (collectedSet[w.en]) {\n        // 已收集：糖果卡（整卡可点 = 朗读）\n        var pal = R.paletteFor(w.en);\n        ctx.save();\n        ctx.shadowColor = 'rgba(80, 55, 130, 0.16)';\n        ctx.shadowBlur = 6;\n        ctx.shadowOffsetY = 3;\n        var cg2 = ctx.createLinearGradient(x, y, x, y + ch);\n        cg2.addColorStop(0, pal.light);\n        cg2.addColorStop(1, R.tint(pal.base, 0.3));\n        ctx.fillStyle = cg2;\n        R.roundRect(ctx, x, y, cw, ch, 14);\n        ctx.fill();\n        ctx.restore();\n        text(w.emoji || '🔤', x + 30, cy, 26, '#343A40');\n        text(w.en, x + 52, cy - 11, 16, pal.dark, 'left', true);\n        text(w.zh, x + 52, cy + 13, 12, R.rgba(pal.dark, 0.75), 'left');\n        R.drawSpeaker(ctx, x + cw - 19, y + ch - 15, 10.5, '#9775FA');\n        state.buttons.push({ x: x, y: y, w: cw, h: ch, text: '', action: 'speak:' + w.en, fill: 'transparent', color: 'transparent', fontSize: 1, disabled: false, invisible: true });\n      } else {\n        // 未收集：灰色锁定卡（不显示词）\n        ctx.save();\n        var lg = ctx.createLinearGradient(x, y, x, y + ch);\n        lg.addColorStop(0, '#E9ECEF');\n        lg.addColorStop(1, '#CED4DA');\n        ctx.fillStyle = lg;\n        R.roundRect(ctx, x, y, cw, ch, 14);\n        ctx.fill();\n        ctx.setLineDash([5, 4]);\n        ctx.strokeStyle = '#ADB5BD';\n        ctx.lineWidth = 1.5;\n        R.roundRect(ctx, x + 2, y + 2, cw - 4, ch - 4, 12);\n        ctx.stroke();\n        ctx.restore();\n        text('🔒', x + cw - 16, y + 14, 12, '#868E96');\n        text('???', x + cw / 2, cy + 4, 16, '#868E96', 'center', true);\n      }\n    });\n  }\n  text('共 ' + words.length + ' 个单词 · 第 ' + (state.wbPage + 1) + ' / ' + pages + ' 页', W / 2, H - 84, 13, '#5B4A8A');\n  addButton(32, H - 64, 110, 40, '上一页', 'wbprev', { fill: '#FFFFFF', color: '#5F3DC4', disabled: state.wbPage <= 0 });\n  addButton(W - 142, H - 64, 110, 40, '下一页', 'wbnext', { fill: '#FFFFFF', color: '#5F3DC4', disabled: state.wbPage >= pages - 1 });\n}\n\n// ---------- 主绘制 ----------\nfunction draw() {\n  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n  ctx.clearRect(0, 0, W, H);\n  if (state.screen === 'home') drawHome();\n  else if (state.screen === 'game') drawGame();\n  else if (state.screen === 'result') drawResult();\n  else if (state.screen === 'wordbook') drawWordbook();\n  // 画按钮（关卡格子的 invisible 按钮只做命中测试，不绘制）\n  state.buttons.forEach(function (btn) {\n    if (!btn.invisible) R.drawButton(ctx, btn);\n  });\n}\n\n// ---------- 触摸 ----------\nfunction handleTap(x, y) {\n  for (var i = state.buttons.length - 1; i >= 0; i--) {\n    var btn = state.buttons[i];\n    if (!btn.disabled && R.hit(btn, x, y)) {\n      handleAction(btn.action);\n      return;\n    }\n  }\n  if (state.screen === 'game') {\n    var g = boardGeom();\n    var c = Math.floor((x - g.x) / g.cell);\n    var r = Math.floor((y - g.y) / g.cell);\n    if (r >= 0 && r < Board.SIZE && c >= 0 && c < Board.SIZE) onTileTap(r, c);\n  }\n}\n\nfunction handleAction(action) {\n  var parts = action.split(':');\n  var name = parts[0], arg = parts[1];\n  if (name === 'grade') {\n    state.grade = parseInt(arg, 10);\n    draw();\n  } else if (name === 'start') {\n    var unlocked = state.progress.unlocked[state.grade] || 1;\n    var idx = unlocked - 1;\n    for (var i = 0; i < unlocked; i++) {\n      idx = i;\n      if (!state.progress.stars[state.grade + '-' + i]) break;\n    }\n    startLevel(state.grade, idx);\n  } else if (name === 'level') {\n    startLevel(state.grade, parseInt(arg, 10));\n  } else if (name === 'home') {\n    state.screen = 'home';\n    draw();\n  } else if (name === 'wordbook') {\n    state.wbGrade = state.grade;\n    state.wbPage = 0;\n    state.screen = 'wordbook';\n    draw();\n  } else if (name === 'wbgrade') {\n    state.wbGrade = parseInt(arg, 10);\n    state.wbPage = 0;\n    draw();\n  } else if (name === 'wbprev') {\n    if (state.wbPage > 0) { state.wbPage--; draw(); }\n  } else if (name === 'wbnext') {\n    state.wbPage++;\n    draw();\n  } else if (name === 'speak') {\n    Speak.speak(arg);\n  } else if (name === 'hint') {\n    if (!state.busy) {\n      state.hintPair = Board.findHint(state.grid);\n      state.message = state.hintPair ? '试试把发光的两个块换一下！' : '没有可走的步了…';\n      draw();\n    }\n  } else if (name === 'retry') {\n    startLevel(state.level.grade, state.level.index);\n  } else if (name === 'next') {\n    startLevel(state.level.grade, state.level.index + 1);\n  }\n}\n\n// ---------- 启动 ----------\nfunction start() {\n  canvas = wx.createCanvas();\n  var info = { windowWidth: 375, windowHeight: 667, pixelRatio: 1 };\n  try { info = wx.getSystemInfoSync(); } catch (e) { /* 用默认 */ }\n  W = info.windowWidth || 375;\n  H = info.windowHeight || 667;\n  DPR = info.pixelRatio || 1;\n  canvas.width = W * DPR;\n  canvas.height = H * DPR;\n  ctx = canvas.getContext('2d');\n  state.progress = loadProgress();\n  wx.onTouchStart(function (e) {\n    if (e.touches && e.touches[0]) handleTap(e.touches[0].clientX, e.touches[0].clientY);\n  });\n  draw();\n}\n\nmodule.exports = { start: start };\n","js/data/words.js":"// 词库加载：数据来自 data/db.json（用户维护的教材词库，唯一的单词数据库）\n// db.json 结构：[{ u: 单元号, t: 单元英文标题, z: 单元中文标题, w: [[en, zh], ...] }, ...]\n// 文件按册顺序排列，每册单元号从 1 重新开始。册与年级的对应（用户 2026-11-24 确认）：\n//   第1册=三年级上册 第2册=三年级下册 第3册=四年级上册 第4册=四年级下册\n//   第5册=五年级上册 第6册=五年级下册 第7册=六年级上册（以此类推）\n// emoji 由 js/data/emoji-map.js 按英文词自动配图；配不上的词只出单词块。\nvar DB = require('../../data/db.json');\nvar EMOJI = require('./emoji-map.js');\n\nvar GRADE_CN = { 3: '三', 4: '四', 5: '五', 6: '六' };\n\n// 按单元号重置切分出每一册\nvar RAW_BOOKS = [];\nvar currentBook = null;\nDB.forEach(function (unit) {\n  if (!currentBook || unit.u === 1) {\n    currentBook = [];\n    RAW_BOOKS.push(currentBook);\n  }\n  currentBook.push(unit);\n});\n\nvar BOOKS = RAW_BOOKS.map(function (units, i) {\n  var grade = 3 + Math.floor(i / 2);\n  var term = i % 2 === 0 ? '上' : '下';\n  return {\n    book: i + 1,\n    grade: grade,\n    term: term,\n    label: (GRADE_CN[grade] || grade) + '年级' + term + '册',\n    units: units\n  };\n});\n\n// 展开成词条：{ en, zh, emoji, grade, book, unit, theme }\nvar ALL = [];\nBOOKS.forEach(function (book) {\n  book.units.forEach(function (unit) {\n    unit.w.forEach(function (pair) {\n      ALL.push({\n        en: pair[0],\n        zh: pair[1],\n        emoji: EMOJI[(pair[0] || '').toLowerCase()] || null,\n        grade: book.grade,\n        book: book.book,\n        unit: unit.u,\n        theme: unit.t || ''\n      });\n    });\n  });\n});\n\n// 按年级分组，同一年级内按英文去重（保留首次出现）\nvar BY_GRADE = {};\nALL.forEach(function (word) {\n  if (!BY_GRADE[word.grade]) BY_GRADE[word.grade] = [];\n  var list = BY_GRADE[word.grade];\n  var dup = list.some(function (w) { return w.en.toLowerCase() === word.en.toLowerCase(); });\n  if (!dup) list.push(word);\n});\n\n// 按英文（不区分大小写）查词条\nvar INDEX = {};\nALL.forEach(function (word) {\n  var key = word.en.toLowerCase();\n  if (!INDEX[key]) INDEX[key] = word;\n});\n\nmodule.exports = {\n  GRADES: [3, 4, 5, 6],\n  ALL: ALL,\n  BOOKS: BOOKS,\n  BY_GRADE: BY_GRADE,\n  byGrade: function (grade) {\n    return BY_GRADE[grade] || [];\n  },\n  // 只含可图示词（有 emoji，可出图画块）\n  picturable: function (grade) {\n    return (BY_GRADE[grade] || []).filter(function (w) { return !!w.emoji; });\n  },\n  lookup: function (en) {\n    return INDEX[(en || '').toLowerCase()] || null;\n  },\n  countByGrade: function () {\n    var out = {};\n    Object.keys(BY_GRADE).forEach(function (g) { out[g] = BY_GRADE[g].length; });\n    return out;\n  }\n};\n","js/data/levels.js":"// 关卡生成：每个年级 8 关，目标词取自该年级词库，难度递增。\n// 难度维度：棋盘不同单词数 5->8、目标词个数 1->3、每个目标收集数递增、步数相对收紧；\n// 另按单词复杂度递进：低关卡只从简单词里抽，高关卡逐步解锁全年级词池，新引入的难词优先做收集目标。\nvar Words = require('./words.js');\n\nvar LEVELS_PER_GRADE = 8;\n\nfunction shuffle(arr, rng) {\n  var a = arr.slice();\n  for (var i = a.length - 1; i > 0; i--) {\n    var j = Math.floor(rng() * (i + 1));\n    var t = a[i]; a[i] = a[j]; a[j] = t;\n  }\n  return a;\n}\n\n// 单词复杂度分：词越长、含空格/连字符、没有配图，越难。\nfunction complexity(w) {\n  var score = w.en.length;\n  if (/[\\s-]/.test(w.en)) score += 4;\n  if (!w.emoji) score += 2;\n  return score;\n}\n\n// 同年级词池按复杂度升序（同分按字母序，结果稳定）\nfunction sortedPool(grade) {\n  return Words.byGrade(grade).slice().sort(function (a, b) {\n    var d = complexity(a) - complexity(b);\n    if (d !== 0) return d;\n    return a.en < b.en ? -1 : (a.en > b.en ? 1 : 0);\n  });\n}\n\n// 第 n 关（index 0..7）的可用池：排序后词池的前 ceil(总数 × (0.35 + 0.65×index/7)) 个词。\n// 第 1 关约 35%，第 8 关 100%（全池）；随关卡单调扩大。\nfunction availablePool(grade, index) {\n  var sorted = sortedPool(grade);\n  var frac = 0.35 + 0.65 * (index / (LEVELS_PER_GRADE - 1));\n  var n = Math.ceil(sorted.length * frac);\n  return sorted.slice(0, n);\n}\n\n// index: 0..7\nfunction getLevel(grade, index, rng) {\n  rng = rng || Math.random;\n  var avail = availablePool(grade, index);\n  var picturable = avail.filter(function (w) { return !!w.emoji; });\n  var plain = avail.filter(function (w) { return !w.emoji; });\n\n  var distinctCount = 5 + Math.min(3, Math.floor(index / 2)); // 5,5,6,6,7,7,8,8\n  var targetCount = index < 2 ? 1 : (index < 5 ? 2 : 3);\n\n  // 收集目标优先从可用池较难的后半段抽（让新引入的难词成为目标），\n  // 后半段里先挑可图示的（棋盘上更好认），不足再从后半段其余词补。\n  var hardHalf = avail.slice(Math.floor(avail.length / 2));\n  var hardPic = shuffle(hardHalf.filter(function (w) { return !!w.emoji; }), rng);\n  var hardPlain = shuffle(hardHalf.filter(function (w) { return !w.emoji; }), rng);\n  var targetWords = hardPic.concat(hardPlain).slice(0, targetCount);\n  // 防御：后半段不足时从全池补（词池很小才可能发生）\n  if (targetWords.length < targetCount) {\n    var used0 = {};\n    targetWords.forEach(function (w) { used0[w.en] = true; });\n    var rest0 = shuffle(avail.filter(function (w) { return !used0[w.en]; }), rng);\n    targetWords = targetWords.concat(rest0.slice(0, targetCount - targetWords.length));\n  }\n\n  // 棋盘词池 = 目标词 + 从可用池补齐（先可图示词，后普通词），共 distinctCount 个\n  var pool = targetWords.slice();\n  var used = {};\n  pool.forEach(function (w) { used[w.en] = true; });\n  var fillPic = shuffle(picturable.filter(function (w) { return !used[w.en]; }), rng);\n  var fillPlain = shuffle(plain.filter(function (w) { return !used[w.en]; }), rng);\n  pool = pool.concat(fillPic, fillPlain).slice(0, distinctCount);\n  pool = shuffle(pool, rng);\n\n  var targets = targetWords.map(function (w) {\n    // 每个目标收集数 3~7，随关卡平缓增长（经模拟校准，保证小学生可通关）\n    return { en: w.en, need: 3 + Math.floor(index / 2) + Math.floor(rng() * 2) };\n  });\n\n  var moves = 18 + index * 3; // 18..39 步\n\n  return {\n    grade: grade,\n    index: index,\n    levelNo: index + 1,\n    pool: pool,               // 本关棋盘词池（词条数组）\n    targets: targets,         // [{en, need}]\n    moves: moves\n  };\n}\n\n// 星级：过关 1 星；剩余步数 >= 20% 加 1 星；>= 40% 再加 1 星\nfunction calcStars(movesLeft, movesTotal) {\n  if (movesTotal <= 0) re ;\n  var groups = [];\n  function key(r, c) { return r + ',' + c; }\n  var r, c, len, i;\n  // 横向\n  for (r = 0; r < size; r++) {\n    c = 0;\n    while (c < size) {\n      if (!grid[r][c]) { c++; continue; }\n      len = 1;\n      while (c + len < size && grid[r][c + len] && grid[r][c + len].id === grid[r][c].id) len++;\n      if (len >= 3) {\n        var g = { id: grid[r][c].id, cells: [] };\n        for (i = 0; i < len; i++) { g.cells.push({ r: r, c: c + i }); marked[key(r, c + i)] = true; }\n        groups.push(g);\n      }\n      c += len;\n    }\n  }\n  // 纵向\n  for (c = 0; c < size; c++) {\n    r = 0;\n    while (r < size) {\n      if (!grid[r][c]) { r++; continue; }\n      len = 1;\n      while (r + len < size && grid[r + len][c] && grid[r + len][c].id === grid[r][c].id) len++;\n      if (len >= 3) {\n        var g2 = { id: grid[r][c].id, cells: [] };\n        for (i = 0; i < len; i++) { g2.cells.push({ r: r + i, c: c }); marked[key(r + i, c)] = true; }\n        groups.push(g2);\n      }\n      r += len;\n    }\n  }\n  var cells = Object.keys(marked).map(function (k) {\n    var p = k.split(',');\n    return { r: parseInt(p[0], 10), c: parseInt(p[1], 10) };\n  });\n  return { cells: cells, groups: groups };\n}\n\nfunction isAdjacent(a, b) {\n  return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;\n}\n\nfunction swapInPlace(grid, a, b) {\n  var t = grid[a.r][a.c];\n  grid[a.r][a.c] = grid[b.r][b.c];\n  grid[b.r][b.c] = t;\n}\n\n// 尝试交换：成功（能形成消除）返回 true 并保留交换；失败自动换回返回 false\nfunction trySwap(grid, a, b) {\n  if (!isAdjacent(a, b)) return false;\n  swapInPlace(grid, a, b);\n  var m = findMatches(grid);\n  if (m.cells.length === 0) {\n    swapInPlace(grid, a, b);\n    return false;\n  }\n  return true;\n}\n\n// 找一步可消除的交换（提示用）；找不到返回 null\nfunction findHint(grid) {\n  var size = grid.length;\n  var dirs = [{ r: 0, c: 1 }, { r: 1, c: 0 }];\n  for (var r = 0; r < size; r++) {\n    for (var c = 0; c < size; c++) {\n      for (var d = 0; d < dirs.length; d++) {\n        var nr = r + dirs[d].r, nc = c + dirs[d].c;\n        if (nr >= size || nc >= size) continue;\n        var a = { r: r, c: c }, b = { r: nr, c: nc };\n        swapInPlace(grid, a, b);\n        var ok = findMatches(grid).cells.length > 0;\n        swapInPlace(grid, a, b);\n        if (ok) return { a: a, b: b };\n      }\n    }\n  }\n  return null;\n}\n\nfunction hasAnyMove(grid) {\n  return !!findHint(grid);\n}\n\n// 生成初始棋盘：无现成消除、且至少有一步可走\nfunction createBoard(pool, size, rng) {\n  size = size || SIZE;\n  rng = rng || defaultRng;\n  var attempt, grid, r, c;\n  for (attempt = 0; attempt < 60; attempt++) {\n    grid = [];\n    for (r = 0; r < size; r++) {\n      grid.push([]);\n      for (c = 0; c < size; c++) {\n        var tile = null;\n        for (var tries = 0; tries < 20; tries++) {\n          tile = makeTile(pick(pool, rng), rng);\n          var badRow = c >= 2 && grid[r][c - 1].id === tile.id && grid[r][c - 2].id === tile.id;\n          var badCol = r >= 2 && grid[r - 1][c].id === tile.id && grid[r - 2][c].id === tile.id;\n          if (!badRow && !badCol) break;\n        }\n        grid[r].push(tile);\n      }\n    }\n    if (findMatches(grid).cells.length === 0 && hasAnyMove(grid)) return grid;\n  }\n  return grid; // 极小概率兜底\n}\n\n// 执行一步消除结算：找到匹配 -> 清除 -> 下落补齐。\n// chain 为连锁序号（从 1 开始），用于计分倍率。\n// 无匹配时返回 null；否则返回 { cleared: {en: 数量}, cells, score, groups }\nfunction resolveStep(grid, pool, rng, chain) {\n  rng = rng || defaultRng;\n  chain = chain || 1;\n  var m = findMatches(grid);\n  if (m.cells.length === 0) return null;\n  var cleared = {};\n  var score = 0;\n  m.groups.forEach(function (g) {\n    cleared[g.id] = (cleared[g.id] || 0) + g.cells.length;\n    score += g.cells.length * 10 + Math.max(0, g.cells.length - 3) * 10; // 4 连及以上额外奖励\n  });\n  score *= chain;\n  m.cells.forEach(function (cell) { grid[cell.r][cell.c] = null; });\n  // 下落 + 顶部补齐\n  var size = grid.length;\n  for (var c = 0; c < size; c++) {\n    var write = size - 1;\n    for (var r = size - 1; r >= 0; r--) {\n      if (grid[r][c]) {\n        grid[write][c] = grid[r][c];\n        if (write !== r) grid[r][c] = null;\n        write--;\n      }\n    }\n    for (var r2 = write; r2 >= 0; r2--) {\n      grid[r2][c] = makeTile(pick(pool, rng), rng);\n    }\n  }\n  return { cleared: cleared, cells: m.cells, groups: m.groups, score: score, chain: chain };\n}\n\n// 完整结算（连锁到底），返回汇总\nfunction resolveAll(grid, pool, rng) {\n  rng = rng || defaultRng;\n  var total = { cleared: {}, score: 0, chains: 0, steps: [] };\n  var chain = 1;\n  var step;\n  while ((step = resolveStep(grid, pool, rng, chain)) !== null) {\n    total.chains = chain;\n    total.score += step.score;\n    Object.keys(step.cleared).forEach(function (id) {\n      total.cleared[id] = (total.cleared[id] || 0) + step.cleared[id];\n    });\n    total.steps.push(step);\n    chain++;\n    if (chain > 30) break; // 安全上限\n  }\n  return total;\n}\n\n// 无路可走时洗牌：保留词池，重新生成一个合法棋盘并写回 grid\nfunction reshuffle(grid, pool, rng) {\n  var fresh = createBoard(pool, grid.length, rng);\n  for (var r = 0; r < grid.length; r++) {\n    for (var c = 0; c < grid.length; c++) grid[r][c] = fresh[r][c];\n  }\n  return grid;\n}\n\nmodule.exports = {\n  SIZE: SIZE,\n  makeTile: makeTile,\n  cloneGrid: cloneGrid,\n  findMatches: findMatches,\n  isAdjacent: isAdjacent,\n  trySwap: trySwap,\n  findHint: findHint,\n  hasAnyMove: hasAnyMove,\n  createBoard: createBoard,\n  resolveStep: resolveStep,\n  resolveAll: resolveAll,\n  reshuffle: reshuffle\n};\n","js/render/render.js":"// Canvas 绘制辅助（糖果风）：果冻方块、光泽按钮、胶囊、面板、橘猫吉祥物、果冻星星。\n// 只负责画，不持有游戏状态。风格对齐设计稿：pastel 糖果色、竖向渐变、顶部高光、底部深色边、柔和阴影。\n\nvar FONT = '\"Arial Rounded MT Bold\", \"Hiragino Maru Gothic ProN\", \"PingFang SC\", sans-serif';\n\n// 糖果色组：light 浅色端 / base 主色 / dark 深色（文字与描边）\nvar PALETTE_SETS = [\n  { light: '#FFE0E8', base: '#FF8FAB', dark: '#C2255C' },\n  { light: '#FFE8CC', base: '#FFA94D', dark: '#D9480F' },\n  { light: '#FFF3BF', base: '#FFD43B', dark: '#B8860B' },\n  { light: '#D3F9D8', base: '#69DB7C', dark: '#2B8A3E' },\n  { light: '#C3FAE8', base: '#3BC9DB', dark: '#0B7285' },\n  { light: '#D0EBFF', base: '#4DABF7', dark: '#1864AB' },\n  { light: '#E5DBFF', base: '#9775FA', dark: '#5F3DC4' },\n  { light: '#FFD8D8', base: '#FF6B6B', dark: '#C92A2A' }\n];\nvar PALETTE = PALETTE_SETS.map(function (s) { return s.base; });\n\nfunction hashCode(str) {\n  var h = 0;\n  str = String(str);\n  for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;\n  return Math.abs(h);\n}\n\n// 同一个词永远同一组颜色\nfunction paletteFor(id) {\n  return PALETTE_SETS[hashCode(id) % PALETTE_SETS.length];\n}\nfunction colorFor(id) {\n  return paletteFor(id).base;\n}\n\nfunction hexRgb(hex) {\n  var n = parseInt(hex.slice(1), 16);\n  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];\n}\nfunction mix(hex, hex2, f) {\n  var a = hexRgb(hex), b = hexRgb(hex2);\n  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' +\n    Math.round(a[1] + (b[1] - a[1]) * f) + ',' +\n    Math.round(a[2] + (b[2] - a[2]) * f) + ')';\n}\nfunction tint(hex, f) { return mix(hex, '#FFFFFF', f); }\nfunction darken(hex, f) { return mix(hex, '#3A2A20', f); }\nfunction rgba(hex, a) {\n  var c = hexRgb(hex);\n  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';\n}\n\n// 确定性伪随机（装饰元素每帧位置一致，不闪烁）\nfunction seededRand(seed) {\n  var a = seed >>> 0;\n  return function () {\n    a |= 0; a = (a + 0x6D2B79F5) | 0;\n    var t = Math.imul(a ^ (a >>> 15), 1 | a);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nfunction roundRect(ctx, x, y, w, h, r) {\n  if (r > w / 2) r = w / 2;\n  if (r > h / 2) r = h / 2;\n  ctx.beginPath();\n  ctx.moveTo(x + r, y);\n  ctx.lineTo(x + w - r, y);\n  ctx.arcTo(x + w, y, x + w, y + r, r);\n  ctx.lineTo(x + w, y + h - r);\n  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);\n  ctx.lineTo(x + r, y + h);\n  ctx.arcTo(x, y + h, x, y + h - r, r);\n  ctx.lineTo(x, y + r);\n  ctx.arcTo(x, y, x + r, y, r);\n  ctx.closePath();\n}\n\n// 星形路径：points 个角（5=星星，4=闪光），inner 为内径比\nfunction starPath(ctx, cx, cy, size, points, inner) {\n  var R = size / 2, r = R * inner;\n  ctx.beginPath();\n  for (var i = 0; i < points * 2; i++) {\n    var rad = i % 2 === 0 ? R : r;\n    var a = -Math.PI / 2 + i * Math.PI / points;\n    var px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;\n    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);\n  }\n  ctx.closePath();\n}\n\n// 单颗果冻星：filled 金色渐变，未得灰色\nfunction drawStar(ctx, cx, cy, size, filled) {\n  ctx.save();\n  starPath(ctx, cx, cy, size, 5, 0.5);\n  if (filled) {\n    var g = ctx.createLinearGradient(cx, cy - size / 2, cx, cy + size / 2);\n    g.addColorStop(0, '#FFE066');\n    g.addColorStop(1, '#FFB800');\n    ctx.fillStyle = g;\n    ctx.fill();\n    ctx.strokeStyle = '#E8A100';\n    ctx.lineWidth = Math.max(1.5, size * 0.05);\n    ctx.stroke();\n    ctx.fillStyle = 'rgba(255,255,255,0.75)';\n    starPath(ctx, cx - size * 0.16, cy - size * 0.2, size * 0.22, 4, 0.24);\n    ctx.fill();\n  } else {\n    ctx.fillStyle = '#DEE2E6';\n    ctx.fill();\n    ctx.strokeStyle = '#CED4DA';\n    ctx.lineWidth = Math.max(1.5, size * 0.05);\n    ctx.stroke();\n  }\n  ctx.restore();\n}\n\n// 星星行：filled 颗实星，其余空星\nfunction drawStars(ctx, cx, cy, filled, total, size) {\n  total = total || 3;\n  var gap = size * 1.22;\n  var startX = cx - gap * (total - 1) / 2;\n  for (var i = 0; i < total; i++) {\n    drawStar(ctx, startX + gap * i, cy, size, i < filled);\n  }\n}\n\n// 柔和阴影面板（白色大圆角卡片）\nfunction drawPanel(ctx, x, y, w, h, fill, r) {\n  ctx.save();\n  ctx.shadowColor = 'rgba(80, 55, 130, 0.18)';\n  ctx.shadowBlur = 12;\n  ctx.shadowOffsetY = 4;\n  ctx.fillStyle = fill || '#FFFFFF';\n  roundRect(ctx, x, y, w, h, r || 18);\n  ctx.fill();\n  ctx.restore();\n}\n\n// 光泽胶囊：竖向渐变 + 顶部高光\nfunction drawCapsule(ctx, x, y, w, h, cLight, cBase) {\n  ctx.save();\n  ctx.shadowColor = 'rgba(80, 55, 130, 0.16)';\n  ctx.shadowBlur = 6;\n  ctx.shadowOffsetY = 2;\n  var g = ctx.createLinearGradient(x, y, x, y + h);\n  g.addColorStop(0, cLight);\n  g.addColorStop(1, cBase);\n  ctx.fillStyle = g;\n  roundRect(ctx, x, y, w, h, h / 2);\n  ctx.fill();\n  ctx.shadowColor = 'transparent';\n  ctx.shadowBlur = 0;\n  ctx.shadowOffsetY = 0;\n  ctx.fillStyle = 'rgba(255,255,255,0.45)';\n  ctx.save();\n  roundRect(ctx, x, y, w, h, h / 2);\n  ctx.clip();\n  ctx.beginPath();\n  ctx.ellipse(x + w / 2, y + h * 0.2, w * 0.34, h * 0.16, 0, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.restore();\n  ctx.restore();\n}\n\n// 通用按钮：粗圆角 + 底部立体边 + 竖向渐变 + 高光。btn = {x,y,w,h,text,fill,color,fontSize,disabled}\nfunction drawButton(ctx, btn) {\n  ctx.save();\n  ctx.globalAlpha = btn.disabled ? 0.45 : 1;\n  var base = btn.fill || '#FF8C42';\n  var r = btn.h / 2;\n  // 底部立体边\n  ctx.fillStyle = darken(base, 0.22);\n  roundRect(ctx, btn.x, btn.y + 3, btn.w, btn.h, r);\n  ctx.fill();\n  // 主体渐变\n  ctx.shadowColor = 'rgba(80, 55, 130, 0.20)';\n  ctx.shadowBlur = 6;\n  ctx.shadowOffsetY = 2;\n  var g = ctx.createLinearGradient(btn.x, btn.y, btn.x, btn.y + btn.h);\n  g.addColorStop(0, tint(base, 0.32));\n  g.addColorStop(1, base);\n  ctx.fillStyle = g;\n  roundRect(ctx, btn.x, btn.y, btn.w, btn.h - 2, r);\n  ctx.fill();\n  ctx.shadowColor = 'transparent';\n  ctx.shadowBlur = 0;\n  ctx.shadowOffsetY = 0;\n  // 顶部高光\n  ctx.fillStyle = 'rgba(255,255,255,0.35)';\n  ctx.save();\n  roundRect(ctx, btn.x, btn.y, btn.w, btn.h - 2, r);\n  ctx.clip();\n  ctx.beginPath();\n  ctx.ellipse(btn.x + btn.w / 2, btn.y + btn.h * 0.16, btn.w * 0.36, btn.h * 0.14, 0, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.restore();\n  // 文字\n  ctx.fillStyle = btn.color || '#FFFFFF';\n  ctx.font = 'bold ' + (btn.fontSize || 16) + 'px ' + FONT;\n  ctx.textAlign = 'center';\n  ctx.textBaseline = 'middle';\n  ctx.fillText(btn.text, btn.x + btn.w / 2, btn.y + (btn.h - 2) / 2 + 1);\n  ctx.restore();\n}\n\nfunction hit(btn, x, y) {\n  return x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h;\n}\n\n// 圆形喇叭按钮（读音）：彩色圆 + 🔊\nfunction drawSpeaker(ctx, cx, cy, r, bg) {\n  ctx.save();\n  var g = ctx.createLinearGradient(cx, cy - r, cx, cy + r);\n  g.addColorStop(0, tint(bg, 0.3));\n  g.addColorStop(1, bg);\n  ctx.fillStyle = g;\n  ctx.beginPath();\n  ctx.arc(cx, cy, r, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.fillStyle = 'rgba(255,255,255,0.4)';\n  ctx.beginPath();\n  ctx.ellipse(cx, cy - r * 0.45, r * 0.55, r * 0.28, 0, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.font = Math.floor(r * 1.05) + 'px sans-serif';\n  ctx.textAlign = 'center';\n  ctx.textBaseline = 'middle';\n  ctx.fillText('🔊', cx, cy + 1);\n  ctx.restore();\n}\n\n// 绿色对勾圆圈\nfunction drawCheck(ctx, cx, cy, r) {\n  ctx.save();\n  var g = ctx.createLinearGradient(cx, cy - r, cx, cy + r);\n  g.addColorStop(0, '#8CE99A');\n  g.addColorStop(1, '#40C057');\n  ctx.fillStyle = g;\n  ctx.beginPath();\n  ctx.arc(cx, cy, r, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.strokeStyle = '#FFFFFF';\n  ctx.lineWidth = r * 0.24;\n  ctx.lineCap = 'round';\n  ctx.lineJoin = 'round';\n  ctx.beginPath();\n  ctx.moveTo(cx - r * 0.5, cy + r * 0.02);\n  ctx.lineTo(cx - r * 0.14, cy + r * 0.38);\n  ctx.lineTo(cx + r * 0.55, cy - r * 0.34);\n  ctx.stroke();\n  ctx.restore();\n}\n\n// 画一个棋盘块（果冻质感）。tile={id,kind}；word 为词条（取 emoji/zh）。\n// opts: { selected, hinted, flash, scale }\nfunction drawTile(ctx, tile, word, x, y, size, opts) {\n  opts = opts || {};\n  var pad = 3;\n  var s = size * (opts.scale || 1);\n  var ox = x + (size - s) / 2, oy = y + (size - s) / 2;\n  var bx = ox + pad, by = oy + pad, bw = s - pad * 2, bh = s - pad * 2;\n  var r = Math.min(16, bw * 0.27);\n  var pal = paletteFor(tile.id);\n  var isPic = tile.kind === 'pic';\n  ctx.save();\n  // 果冻主体：竖向渐变（上浅下深）+ 柔和阴影\n  ctx.shadowColor = 'rgba(80, 55, 130, 0.25)';\n  ctx.shadowBlur = 5;\n  ctx.shadowOffsetY = 3;\n  var g = ctx.createLinearGradient(bx, by, bx, by + bh);\n  if (isPic) {\n    g.addColorStop(0, '#FFFDF6');\n    g.addColorStop(1, pal.light);\n  } else {\n    g.addColorStop(0, pal.light);\n    g.addColorStop(1, mix(pal.base, pal.light, 0.3));\n  }\n  ctx.fillStyle = g;\n  roundRect(ctx, bx, by, bw, bh, r);\n  ctx.fill();\n  ctx.shadowColor = 'transparent';\n  ctx.shadowBlur = 0;\n  ctx.shadowOffsetY = 0;\n  // 内饰：底部深色边 + 顶部白色高光\n  ctx.save();\n  roundRect(ctx, bx, by, bw, bh, r);\n  ctx.clip();\n  ctx.fillStyle = rgba(pal.dark, 0.28);\n  ctx.fillRect(bx, by + bh * 0.84, bw, bh * 0.16);\n  ctx.fillStyle = 'rgba(255,255,255,0.55)';\n  ctx.beginPath();\n  ctx.ellipse(bx + bw / 2, by + bh * 0.16, bw * 0.33, bh * 0.12, 0, 0, Math.PI * 2);\n  ctx.fill();\n  if (isPic) {\n    ctx.strokeStyle = rgba(pal.dark, 0.45);\n    ctx.lineWidth = 2;\n    roundRect(ctx, bx + 1, by + 1, bw - 2, bh - 2, r);\n    ctx.stroke();\n  }\n  ctx.restore();\n\n  if (opts.flash) {\n    ctx.fillStyle = 'rgba(255,255,255,0.6)';\n    roundRect(ctx, bx, by, bw, bh, r);\n    ctx.fill();\n    ctx.fillStyle = '#FFD43B';\n    starPath(ctx, bx + bw * 0.2, by + bh * 0.22, s * 0.16, 4, 0.24);\n    ctx.fill();\n    starPath(ctx, bx + bw * 0.82, by + bh * 0.3, s * 0.12, 4, 0.24);\n    ctx.fill();\n    starPath(ctx, bx + bw * 0.7, by + bh * 0.78, s * 0.13, 4, 0.24);\n    ctx.fill();\n  }\n\n  ctx.textAlign = 'center';\n  ctx.textBaseline = 'middle';\n  if (isPic) {\n    ctx.font = Math.floor(s * 0.46) + 'px sans-serif';\n    ctx.fillText(word ? word.emoji : '❓', ox + s / 2, oy + s / 2 - s * 0.05);\n    ctx.fillStyle = pal.dark;\n    ctx.font = 'bold ' + Math.floor(s * 0.155) + 'px ' + FONT;\n    ctx.fillText(tile.id, ox + s / 2, oy + s - s * 0.17);\n  } else {\n    var en = tile.id;\n    var fontSize = Math.floor(s * (en.length > 7 ? 0.185 : en.length > 5 ? 0.225 : 0.27));\n    ctx.fillStyle = pal.dark;\n    ctx.font = 'bold ' + fontSize + 'px ' + FONT;\n    ctx.fillText(en, ox + s / 2, oy + s / 2 - s * 0.09);\n    if (word && word.zh) {\n      ctx.font = Math.floor(s * 0.165) + 'px ' + FONT;\n      ctx.globalAlpha = 0.78;\n      ctx.fillText(word.z x.moveTo(cx + radius * 0.04, cy - radius * 1.0);\n  ctx.lineTo(cx + radius * 0.07, cy - radius * 0.64);\n  ctx.moveTo(cx + radius * 0.34, cy - radius * 0.92);\n  ctx.lineTo(cx + radius * 0.31, cy - radius * 0.6);\n  ctx.moveTo(cx - radius * 0.99, cy - radius * 0.05);\n  ctx.lineTo(cx - radius * 0.72, cy + radius * 0.05);\n  ctx.moveTo(cx + radius * 0.99, cy - radius * 0.05);\n  ctx.lineTo(cx + radius * 0.72, cy + radius * 0.05);\n  ctx.stroke();\n  // 口鼻区（浅色）\n  ctx.fillStyle = 'rgba(255, 236, 200, 0.85)';\n  ctx.beginPath();\n  ctx.ellipse(cx, cy + radius * 0.42, radius * 0.42, radius * 0.3, 0, 0, Math.PI * 2);\n  ctx.fill();\n  // 腮红\n  ctx.fillStyle = 'rgba(255, 130, 160, 0.55)';\n  ctx.beginPath();\n  ctx.ellipse(cx - radius * 0.62, cy + radius * 0.28, radius * 0.16, radius * 0.1, 0, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.beginPath();\n  ctx.ellipse(cx + radius * 0.62, cy + radius * 0.28, radius * 0.16, radius * 0.1, 0, 0, Math.PI * 2);\n  ctx.fill();\n  // 眼睛（大眼 + 高光）\n  [[-1], [1]].forEach(function (sgn) {\n    var ex = cx + sgn[0] * radius * 0.34, ey = cy - radius * 0.08;\n    ctx.fillStyle = '#343A40';\n    ctx.beginPath();\n    ctx.ellipse(ex, ey, radius * 0.105, radius * 0.14, 0, 0, Math.PI * 2);\n    ctx.fill();\n    ctx.fillStyle = '#FFFFFF';\n    ctx.beginPath();\n    ctx.arc(ex - radius * 0.035, ey - radius * 0.05, radius * 0.04, 0, Math.PI * 2);\n    ctx.fill();\n  });\n  // 鼻子 + 嘴\n  ctx.fillStyle = '#F06595';\n  ctx.beginPath();\n  ctx.moveTo(cx - radius * 0.09, cy + radius * 0.24);\n  ctx.lineTo(cx + radius * 0.09, cy + radius * 0.24);\n  ctx.lineTo(cx, cy + radius * 0.37);\n  ctx.closePath();\n  ctx.fill();\n  ctx.strokeStyle = '#8A5A2B';\n  ctx.lineWidth = radius * 0.045;\n  ctx.beginPath();\n  ctx.arc(cx - radius * 0.13, cy + radius * 0.36, radius * 0.13, 0.15 * Math.PI, 0.9 * Math.PI);\n  ctx.stroke();\n  ctx.beginPath();\n  ctx.arc(cx + radius * 0.13, cy + radius * 0.36, radius * 0.13, 0.1 * Math.PI, 0.85 * Math.PI);\n  ctx.stroke();\n  // 胡须\n  ctx.strokeStyle = 'rgba(138, 90, 43, 0.65)';\n  ctx.lineWidth = radius * 0.035;\n  ctx.beginPath();\n  ctx.moveTo(cx - radius * 0.97, cy + radius * 0.18);\n  ctx.lineTo(cx - radius * 0.48, cy + radius * 0.27);\n  ctx.moveTo(cx - radius * 0.94, cy + radius * 0.48);\n  ctx.lineTo(cx - radius * 0.47, cy + radius * 0.44);\n  ctx.moveTo(cx + radius * 0.97, cy + radius * 0.18);\n  ctx.lineTo(cx + radius * 0.48, cy + radius * 0.27);\n  ctx.moveTo(cx + radius * 0.94, cy + radius * 0.48);\n  ctx.lineTo(cx + radius * 0.47, cy + radius * 0.44);\n  ctx.stroke();\n  // 眼镜\n  if (opts.glasses) {\n    ctx.strokeStyle = '#5F4B8B';\n    ctx.lineWidth = radius * 0.05;\n    ctx.beginPath();\n    ctx.arc(cx - radius * 0.34, cy - radius * 0.08, radius * 0.25, 0, Math.PI * 2);\n    ctx.stroke();\n    ctx.beginPath();\n    ctx.arc(cx + radius * 0.34, cy - radius * 0.08, radius * 0.25, 0, Math.PI * 2);\n    ctx.stroke();\n    ctx.beginPath();\n    ctx.moveTo(cx - radius * 0.09, cy - radius * 0.1);\n    ctx.lineTo(cx + radius * 0.09, cy - radius * 0.1);\n    ctx.stroke();\n  }\n  // 学士帽\n  if (opts.cap) {\n    ctx.save();\n    ctx.translate(cx + radius * 0.08, cy - radius * 0.94);\n    ctx.rotate(-0.1);\n    ctx.fillStyle = '#22304A';\n    roundRect(ctx, -radius * 0.36, -radius * 0.02, radius * 0.72, radius * 0.22, radius * 0.06);\n    ctx.fill();\n    ctx.fillStyle = '#2B3A55';\n    ctx.beginPath();\n    ctx.moveTo(-radius * 0.66, -radius * 0.06);\n    ctx.lineTo(0, -radius * 0.3);\n    ctx.lineTo(radius * 0.66, -radius * 0.06);\n    ctx.lineTo(0, radius * 0.16);\n    ctx.closePath();\n    ctx.fill();\n    ctx.strokeStyle = '#FFD43B';\n    ctx.lineWidth = radius * 0.045;\n    ctx.beginPath();\n    ctx.moveTo(radius * 0.55, -radius * 0.02);\n    ctx.lineTo(radius * 0.55, radius * 0.3);\n    ctx.stroke();\n    ctx.fillStyle = '#FFD43B';\n    ctx.beginPath();\n    ctx.arc(radius * 0.55, radius * 0.36, radius * 0.07, 0, Math.PI * 2);\n    ctx.fill();\n    ctx.restore();\n  }\n  // 竖大拇指的爪子（右
